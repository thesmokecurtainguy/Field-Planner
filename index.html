<script>
const DAYS         = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAYS_SHORT   = ['Su','Mo','Tu','We','Th','Fr','Sa'];
const MONTHS       = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const STATUSES     = ['travel','ooo','vacation','family','vpres','mis'];
const STATUS_LABELS= { travel:'Travel', ooo:'OOO', vacation:'Vacation', family:'Family', vpres:'Virtual', mis:'MIS' };

const today = new Date();
today.setHours(0,0,0,0);

let cur          = { year: today.getFullYear(), month: today.getMonth() };
let curWeekStart = getWeekStart(today);
let curDay       = new Date(today);
let currentView  = 'dashboard';
let plateModalPid = null;
let modalDk      = null;
let modalDate    = null;
let modalEvents  = [];
let modalFlights = [];
let modalRecurringOriginalIds = [];
let modalMultidayOriginalIds = [];
const MULTIDAY_SYNC_KEY = '__multiday__';

function getWeekStart(date) {
  const d = new Date(date); d.setHours(0,0,0,0);
  d.setDate(d.getDate() - d.getDay());
  return d;
}

// ── DATA LAYER ───────────────────────────────────────────────────────────────
const STORAGE_KEY = 'fp-data';
function loadLocal()   { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e) { return {}; } }
function saveLocal(d)  { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }

function apiHeaders(extra) {
  return { 'Content-Type': 'application/json', ...(extra || {}) };
}
function apiFetch(url, opts = {}) {
  return fetch(url, { ...opts, credentials: 'include', headers: { ...apiHeaders(opts.headers), ...(opts.headers || {}) } });
}

let CURRENT_USER = null;

function showLogin(message) {
  const overlay = document.getElementById('login-overlay');
  const err = document.getElementById('login-error');
  if (err) {
    if (message) { err.textContent = message; err.classList.add('visible'); }
    else { err.textContent = ''; err.classList.remove('visible'); }
  }
  if (overlay) overlay.classList.add('open');
  document.getElementById('user-chip')?.classList.remove('visible');
  setTimeout(() => document.getElementById('login-username')?.focus(), 50);
}

function hideLogin() {
  document.getElementById('login-overlay')?.classList.remove('open');
  document.getElementById('login-error')?.classList.remove('visible');
}

function setCurrentUser(user) {
  CURRENT_USER = user;
  const chip = document.getElementById('user-chip');
  const name = document.getElementById('user-name');
  if (user && chip && name) {
    name.textContent = user.username;
    chip.classList.add('visible');
  } else if (chip) {
    chip.classList.remove('visible');
  }
}

async function handleLoginSubmit(e) {
  e.preventDefault();
  const username = document.getElementById('login-username')?.value.trim();
  const password = document.getElementById('login-password')?.value || '';
  const btn = document.getElementById('login-submit');
  const err = document.getElementById('login-error');
  if (!username || !password) return false;
  if (btn) btn.disabled = true;
  if (err) { err.textContent = ''; err.classList.remove('visible'); }
  try {
    const r = await apiFetch('/api/auth/login', {
      method: 'POST',
      body: JSON.stringify({ username, password }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || 'Login failed');
    setCurrentUser(data.user);
    hideLogin();
    const pw = document.getElementById('login-password');
    if (pw) pw.value = '';
    await syncOnLoad();
  } catch (ex) {
    if (err) { err.textContent = ex.message || 'Login failed'; err.classList.add('visible'); }
  } finally {
    if (btn) btn.disabled = false;
  }
  return false;
}

async function logout() {
  try { await apiFetch('/api/auth/logout', { method: 'POST' }); } catch (_) {}
  setCurrentUser(null);
  showLogin();
  setSyncStatus('error', '⚠ Signed out');
}

async function ensureAuth() {
  try {
    const r = await apiFetch('/api/auth/me');
    if (!r.ok) {
      showLogin();
      return false;
    }
    const data = await r.json();
    setCurrentUser(data.user);
    hideLogin();
    return true;
  } catch (_) {
    showLogin('Could not reach the server.');
    return false;
  }
}

let DATA        = loadLocal();
let _syncTimer  = null;
let _pushing    = false;
let _pushPending= false;
let _pulling    = false;
let _localDirty = false;
let _saveEpoch  = 0;
let _serverRevision = 0;
let _dirtyKeys  = new Set();
let _deletedKeys= new Set();
const PULL_INTERVAL_MS = 15000;
const TODOS_SYNC_KEY = '__todos__';
const PROJECTS_SYNC_KEY = '__projects__';
const BACKGROUND_PULL_SKIP = new Set([TODOS_SYNC_KEY, PROJECTS_SYNC_KEY]);

function hasPendingPush() {
  return _localDirty || _syncTimer != null || _pushing || _pushPending;
}

function shouldSkipRemoteKey(k) {
  if (_localDirty) return true;
  if (_dirtyKeys.has(k) || _deletedKeys.has(k)) return true;
  if (k === TODOS_SYNC_KEY && hasPendingPush()) return true;
  return false;
}

function shouldBackgroundPullKey(k) {
  return BACKGROUND_PULL_SKIP.has(k);
}

function isStoredArrayKey(k) {
  return k.endsWith('-events') || k.endsWith('-flights') || k === '__recurring__' || k === MULTIDAY_SYNC_KEY;
}

function markDirty(...keys) {
  keys.forEach(k => {
    _dirtyKeys.add(k);
    _deletedKeys.delete(k);
  });
}

function markDeleted(...keys) {
  keys.forEach(k => {
    _deletedKeys.add(k);
    _dirtyKeys.delete(k);
  });
}

function buildPushPayload() {
  const payload = {};
  _dirtyKeys.forEach(k => {
    if (k in DATA) payload[k] = DATA[k];
  });
  _deletedKeys.forEach(k => { payload[k] = null; });
  return payload;
}

function clearPushState(payload) {
  Object.keys(payload).forEach(k => {
    if (payload[k] === null) {
      if (_deletedKeys.has(k)) _deletedKeys.delete(k);
      return;
    }
    if (!_dirtyKeys.has(k)) return;
    if (DATA[k] === payload[k]) _dirtyKeys.delete(k);
  });
}

function setSyncStatus(state, label) {
  const btn = document.getElementById('sync-btn');
  if (!btn) return;
  btn.className = state;
  btn.textContent = label;
}

function schedulePush(delayMs) {
  _localDirty = true;
  _saveEpoch += 1;
  setSyncStatus('unsaved', '● Unsaved');
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(pushToRemote, delayMs);
}

function saveData(d) {
  saveLocal(d);
  schedulePush(800);
}

/** Home dashboard prefs — top-level keys on DATA, POSTed to `/api/data` with the rest of the blob. */
const DATA_KEY_DASH_TOP3 = 'fp-dash-top3-project';
const DATA_KEY_DASH_SHOW_HIDDEN = 'fp-dash-show-hidden-plates';
const DATA_KEY_DASH_UPCOMING_TASKS = 'fp-dash-upcoming-tasks';

const SCHED_START_H = 4;
const SCHED_END_H = 18;
const SCHED_SLOT_MIN = 30;

let _fpDashPrefsMigrated = false;
/** Copies legacy standalone-localStorage values into DATA once, then removes the loose keys. */
function migrateDashPrefsIntoData() {
  if (_fpDashPrefsMigrated) return;
  let changed = false;
  try {
    const t = localStorage.getItem(DATA_KEY_DASH_TOP3);
    if (t && (DATA[DATA_KEY_DASH_TOP3] == null || DATA[DATA_KEY_DASH_TOP3] === '')) {
      DATA[DATA_KEY_DASH_TOP3] = t;
      changed = true;
    }
    if (localStorage.getItem(DATA_KEY_DASH_SHOW_HIDDEN) === '1' && DATA[DATA_KEY_DASH_SHOW_HIDDEN] !== '1') {
      DATA[DATA_KEY_DASH_SHOW_HIDDEN] = '1';
      changed = true;
    }
    const u = localStorage.getItem(DATA_KEY_DASH_UPCOMING_TASKS);
    if (u === '1' && DATA[DATA_KEY_DASH_UPCOMING_TASKS] !== '1') {
      DATA[DATA_KEY_DASH_UPCOMING_TASKS] = '1';
      changed = true;
    }
    if (changed) {
      try {
        localStorage.removeItem(DATA_KEY_DASH_TOP3);
        localStorage.removeItem(DATA_KEY_DASH_SHOW_HIDDEN);
        localStorage.removeItem(DATA_KEY_DASH_UPCOMING_TASKS);
      } catch (_) {}
      markDirty(DATA_KEY_DASH_TOP3, DATA_KEY_DASH_SHOW_HIDDEN, DATA_KEY_DASH_UPCOMING_TASKS);
      saveData(DATA);
    }
  } catch (e) { console.warn('[FP] dash prefs migrate', e); }
  _fpDashPrefsMigrated = true;
}

function noteServerRevision(res) {
  const rev = Number(res.headers.get('X-FP-Revision'));
  if (Number.isFinite(rev) && rev > 0) _serverRevision = rev;
}

function applyServerData(remote, revision) {
  DATA = { ...(remote || {}) };
  if (Number.isFinite(revision) && revision > 0) _serverRevision = revision;
  _localDirty = false;
  _dirtyKeys.clear();
  _deletedKeys.clear();
  saveLocal(DATA);
}

async function pushToRemote() {
  if (_pushing) { _pushPending = true; return; }
  clearTimeout(_syncTimer);
  _syncTimer = null;
  const epochAtSend = _saveEpoch;
  const snapshot = JSON.stringify(DATA);
  _pushing     = true;
  _pushPending = false;
  setSyncStatus('syncing', '⟳ Saving…');
  try {
    const r = await fetch('/api/data', {
      method: 'POST',
      headers: apiHeaders({ 'X-FP-Base-Revision': String(_serverRevision || 0) }),
      body: snapshot,
      credentials: 'include',
    });
    if (r.status === 401) { showLogin('Please sign in again.'); throw new Error(401); }
    if (r.status === 409) {
      // Another device saved first (e.g. Melissa still had the old event). Take server truth.
      const body = await r.json().catch(() => ({}));
      applyServerData(body.data || {}, Number(body.revision) || Number(r.headers.get('X-FP-Revision')));
      migrateDashPrefsIntoData();
      migrateWeekLocationsToDays();
      render();
      setSyncStatus('saved', '✓ Updated');
      _pushing = false;
      _pushPending = false;
      return;
    }
    if (!r.ok) throw new Error(r.status);
    noteServerRevision(r);
    // If the user edited/deleted while this request was in flight, keep dirty and push again.
    if (epochAtSend === _saveEpoch && JSON.stringify(DATA) === snapshot) {
      // Capture touched event days before clearing dirty state (Google sync is scoped to these).
      const googleKeys = [..._dirtyKeys].filter(k => k.endsWith('-events') || k === MULTIDAY_SYNC_KEY);
      _localDirty = false;
      _dirtyKeys.clear();
      _deletedKeys.clear();
      setSyncStatus('saved', '✓ Saved');
      // Never block Railway saves on Google — sync in background for touched days / multiday only.
      if (googleKeys.length) syncGoogleCalendar(googleKeys);
    } else {
      _localDirty = true;
      _pushPending = true;
      setSyncStatus('unsaved', '● Unsaved');
    }
  } catch(e) {
    console.warn('[FP] Push failed, retrying in 5s:', e);
    setSyncStatus('error', '⚠ Retry…');
    _pushing = false;
    setTimeout(pushToRemote, 5000);
    return;
  }
  _pushing = false;
  if (_pushPending) { _pushPending = false; pushToRemote(); }
}

/**
 * Merge googleEventId / googleSyncedAt from a Google sync response into local DATA
 * without clobbering in-flight local edits on other fields.
 */
function mergeGoogleIdsIntoArrayKey(remote, key) {
  let remoteEvents;
  try { remoteEvents = JSON.parse(remote[key] || '[]'); } catch (_) { return; }
  if (!Array.isArray(remoteEvents)) return;

  let localEvents;
  try { localEvents = JSON.parse(DATA[key] || '[]'); } catch (_) { localEvents = []; }
  if (!Array.isArray(localEvents)) localEvents = [];

  const byId = new Map(remoteEvents.filter(e => e && e.id).map(e => [String(e.id), e]));
  let changed = false;
  localEvents.forEach(ev => {
    if (!ev || !ev.id) return;
    const r = byId.get(String(ev.id));
    if (!r) return;
    if (r.googleEventId && ev.googleEventId !== r.googleEventId) {
      ev.googleEventId = r.googleEventId;
      changed = true;
    }
    if (r.googleSyncedAt && ev.googleSyncedAt !== r.googleSyncedAt) {
      ev.googleSyncedAt = r.googleSyncedAt;
      changed = true;
    }
  });
  if (!DATA[key] && remote[key]) {
    DATA[key] = remote[key];
  } else if (changed) {
    DATA[key] = JSON.stringify(localEvents);
  }
}

function mergeGoogleSyncIntoLocal(remote, revision) {
  if (!remote || typeof remote !== 'object') return;
  Object.keys(remote).forEach(k => {
    if (k === '__google_synced_ids__') {
      DATA[k] = remote[k];
      return;
    }
    if (k === MULTIDAY_SYNC_KEY || k.endsWith('-events')) {
      mergeGoogleIdsIntoArrayKey(remote, k);
    }
  });
  if (Number.isFinite(revision) && revision > 0) _serverRevision = revision;
  saveLocal(DATA);
}

let _googleSyncing = false;
let _googleSyncQueuedKeys = null; // Set of event keys to sync after the in-flight call
async function syncGoogleCalendar(keys) {
  const keyList = Array.isArray(keys)
    ? keys.filter(k => typeof k === 'string' && (k.endsWith('-events') || k === MULTIDAY_SYNC_KEY))
    : [];
  if (_googleSyncing) {
    if (!_googleSyncQueuedKeys) _googleSyncQueuedKeys = new Set();
    keyList.forEach(k => _googleSyncQueuedKeys.add(k));
    return;
  }
  _googleSyncing = true;
  let pending = new Set(keyList);
  try {
    while (pending.size) {
      const batch = [...pending];
      pending = new Set();
      const r = await apiFetch('/api/google-calendar/sync', {
        method: 'POST',
        body: JSON.stringify({ keys: batch }),
      });
      if (r.status === 503 || r.status === 401) return;
      if (!r.ok) {
        const body = await r.json().catch(() => ({}));
        console.warn('[FP] Google Calendar sync failed:', r.status, body.error || '');
        return;
      }
      const body = await r.json();
      mergeGoogleSyncIntoLocal(body.data || {}, Number(body.revision));
      if (body.rateLimited) {
        console.warn('[FP] Google Calendar rate limited — will retry on next event save');
      }
      if (body.errors && body.errors.length) {
        console.warn('[FP] Google Calendar sync partial errors:', body.errors);
      }
      if (_googleSyncQueuedKeys && _googleSyncQueuedKeys.size) {
        _googleSyncQueuedKeys.forEach(k => pending.add(k));
        _googleSyncQueuedKeys = null;
      }
    }
  } catch (e) {
    console.warn('[FP] Google Calendar sync error:', e);
  } finally {
    _googleSyncing = false;
  }
}

async function syncNow() {
  clearTimeout(_syncTimer);
  _syncTimer = null;
  flushAllTodoEdits();
  // Save only — never pull first (that was overwriting local edits with stale server data).
  await pushToRemote();
}

async function forcePush() { await syncNow(); }

function todoTs(t) {
  return (t && (t.updatedAt || t.createdAt)) || 0;
}

function touchTodo(t) {
  if (t) t.updatedAt = Date.now();
}

/** Merge two todo records — newer updatedAt wins; null in the newer copy clears optional fields. */
function mergeTodoObjects(prev, incoming) {
  if (!prev) return { ...incoming };
  if (!incoming) return { ...prev };
  const OPT = ['dueBy', 'blockDate', 'blockStart', 'blockEnd', 'importance'];
  if (todoTs(incoming) >= todoTs(prev)) {
    const out = { ...prev, ...incoming };
    for (const f of OPT) {
      if (f in incoming && incoming[f] == null) delete out[f];
    }
    return out;
  }
  return { ...prev };
}

let _todoTextSaveTimer = null;
let _todoTextSavePending = null;

function flushPendingTodoText() {
  clearTimeout(_todoTextSaveTimer);
  if (!_todoTextSavePending) return false;
  const p = _todoTextSavePending;
  _todoTextSavePending = null;
  const todos = getTodos();
  const t = todos.find(x => x.id === p.id);
  if (!t || t.text === p.text) return false;
  t.text = p.text;
  touchTodo(t);
  DATA[TODOS_SYNC_KEY] = JSON.stringify(todos);
  markDirty(TODOS_SYNC_KEY);
  _localDirty = true;
  _saveEpoch += 1;
  saveLocal(DATA);
  return true;
}

function flushAllTodoEdits() {
  let changed = flushPendingTodoText();
  const edits = new Map();
  document.querySelectorAll('textarea.todo-text[data-todo-id]').forEach(el => {
    if (el.dataset.todoId) edits.set(el.dataset.todoId, el.value);
  });
  if (edits.size) {
    const todos = getTodos();
    edits.forEach((text, id) => {
      const t = todos.find(x => x.id === id);
      if (t && t.text !== text) { t.text = text; touchTodo(t); changed = true; }
    });
    if (changed) {
      DATA[TODOS_SYNC_KEY] = JSON.stringify(todos);
      markDirty(TODOS_SYNC_KEY);
      _localDirty = true;
      _saveEpoch += 1;
      saveLocal(DATA);
    }
  }
  return changed;
}

function pushToRemoteKeepalive() {
  try {
    fetch('/api/data', {
      method: 'POST',
      headers: apiHeaders({ 'X-FP-Base-Revision': String(_serverRevision || 0) }),
      body: JSON.stringify(DATA),
      credentials: 'include',
      keepalive: true,
    });
  } catch (_) {}
}

// Flush on page unload using keepalive so the request survives tab close
window.addEventListener('beforeunload', () => {
  clearTimeout(_syncTimer);
  flushAllTodoEdits();
  if (_localDirty) pushToRemoteKeepalive();
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    flushAllTodoEdits();
    if (_localDirty) {
      clearTimeout(_syncTimer);
      _syncTimer = null;
      pushToRemoteKeepalive();
    }
    return;
  }
  // Never pull on focus if we have unsaved work; otherwise refresh from server.
  if (!_localDirty) pullFromRemote({ quiet: true, background: true });
});

function mergeStoredJsonArrays(baseRaw, overlayRaw, idKey, mergeItem) {
  let base = [], overlay = [];
  try { base = JSON.parse(baseRaw || '[]'); } catch (_) {}
  try { overlay = JSON.parse(overlayRaw || '[]'); } catch (_) {}
  if (!Array.isArray(base)) base = [];
  if (!Array.isArray(overlay)) overlay = [];

  const combine = mergeItem || ((a, b) => (a ? { ...a, ...b } : { ...b }));

  const byId = new Map();
  base.forEach(item => {
    if (item && item[idKey]) byId.set(item[idKey], { ...item });
  });
  overlay.forEach(item => {
    if (!item || !item[idKey]) return;
    const prev = byId.get(item[idKey]);
    byId.set(item[idKey], combine(prev, item));
  });

  const order = [];
  const seen = new Set();
  overlay.forEach(item => {
    if (item && item[idKey] && byId.has(item[idKey])) {
      order.push(byId.get(item[idKey]));
      seen.add(item[idKey]);
    }
  });
  base.forEach(item => {
    if (item && item[idKey] && !seen.has(item[idKey])) {
      order.push(byId.get(item[idKey]));
      seen.add(item[idKey]);
    }
  });
  return JSON.stringify(order);
}

function mergeRemoteIntoData(remote, opts = {}) {
  const respectDirty = !!opts.respectDirty;
  const background = !!opts.background;
  const skipKey = k => {
    if (background && shouldBackgroundPullKey(k)) return true;
    return respectDirty && shouldSkipRemoteKey(k);
  };
  let changed = false;

  for (const [k, v] of Object.entries(remote)) {
    if (skipKey(k)) continue;
    if (k === TODOS_SYNC_KEY || k === PROJECTS_SYNC_KEY) {
      const itemMerge = k === TODOS_SYNC_KEY ? mergeTodoObjects : null;
      const merged = mergeStoredJsonArrays(DATA[k], v, 'id', itemMerge);
      if (merged !== (DATA[k] || '[]')) { DATA[k] = merged; changed = true; }
    } else if (isStoredArrayKey(k)) {
      // Honor remote clears ('[]') — previously we kept stale local events forever.
      if (DATA[k] !== v) {
        DATA[k] = v;
        changed = true;
      }
    } else if (DATA[k] !== v) {
      DATA[k] = v;
      changed = true;
    }
  }
  return changed;
}

async function pullFromRemote(opts = {}) {
  if (_pulling || _pushing || _localDirty || _syncTimer != null) return false;
  _pulling = true;
  try {
    flushAllTodoEdits();
    if (_localDirty) return false;
    const r = await fetch('/api/data', { headers: apiHeaders(), credentials: 'include' });
    if (!r.ok) {
      if (r.status === 401) { showLogin('Please sign in again.'); return false; }
      throw new Error(r.status);
    }
    noteServerRevision(r);
    const remote = await r.json();
    // For cross-device sync, replace from server when we have no local edits.
    const before = JSON.stringify(DATA);
    applyServerData(remote, _serverRevision);
    migrateDashPrefsIntoData();
    migrateWeekLocationsToDays();
    const changed = before !== JSON.stringify(DATA);
    if (changed) {
      render();
      if (!opts.quiet) setSyncStatus('saved', '✓ Updated');
    } else if (!opts.quiet) {
      setSyncStatus('saved', '✓ Saved');
    }
    return changed;
  } catch (e) {
    console.warn('[FP] Pull failed:', e);
    if (!opts.quiet) setSyncStatus('error', '⚠ Offline');
    return false;
  } finally {
    _pulling = false;
  }
}

setInterval(() => {
  if (document.visibilityState === 'visible') pullFromRemote({ quiet: true, background: true });
}, PULL_INTERVAL_MS);

async function syncOnLoad() {
  setSyncStatus('syncing', '⟳ Syncing…');
  try {
    const r = await fetch('/api/data', { headers: apiHeaders(), credentials: 'include' });
    if (!r.ok) {
      if (r.status === 401) {
        showLogin();
        setSyncStatus('error', '⚠ Sign in');
        return;
      }
      throw new Error(r.status);
    }
    noteServerRevision(r);
    const remote = await r.json();
    const local = loadLocal();
    const remoteEmpty = Object.keys(remote).length === 0;
    const localHad = Object.keys(local).length > 0;

    // Server is source of truth after login. Only seed the server from local
    // when the database is empty (first migration / empty Postgres).
    if (remoteEmpty && localHad) {
      DATA = { ...local };
      saveLocal(DATA);
      migrateDashPrefsIntoData();
      migrateWeekLocationsToDays();
      render();
      _localDirty = true;
      await pushToRemote();
      return;
    }

    applyServerData(remote, _serverRevision);
    migrateDashPrefsIntoData();
    migrateWeekLocationsToDays();
    render();
    setSyncStatus('saved', '✓ Saved');
  } catch(e) {
    console.warn('[FP] Remote fetch failed, using local cache:', e);
    migrateDashPrefsIntoData();
    migrateWeekLocationsToDays();
    render();
    setSyncStatus('error', '⚠ Offline');
  }
}

(async function boot() {
  const ok = await ensureAuth();
  if (!ok) {
    setSyncStatus('error', '⚠ Sign in');
    migrateDashPrefsIntoData();
    migrateWeekLocationsToDays();
    return;
  }
  await syncOnLoad();
})();

// ── HELPERS ──────────────────────────────────────────────────────────────────
function dk(y, m, d)  { return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function dkFromDate(date) { return dk(date.getFullYear(), date.getMonth(), date.getDate()); }
function lk(y, m, w)  { return `loc-${y}-${m}-${w}`; }
function dayLocationKey(key) { return key + '-location'; }
function getDayLocation(key) { return DATA[dayLocationKey(key)] || ''; }
function setDayLocation(key, val) {
  const dk = dayLocationKey(key);
  if (val) {
    DATA[dk] = val;
    markDirty(dk);
  } else {
    delete DATA[dk];
    markDeleted(dk);
  }
  saveData(DATA);
}

let _fpDayLocMigrated = false;
function migrateWeekLocationsToDays() {
  if (_fpDayLocMigrated) return;
  _fpDayLocMigrated = true;
  let changed = false;
  Object.keys(DATA).forEach(k => {
    if (!k.startsWith('loc-')) return;
    const m = /^loc-(\d+)-(\d+)-(\d+)$/.exec(k);
    if (!m) return;
    const year = +m[1], month = +m[2], wi = +m[3];
    const weekLoc = (DATA[k] || '').trim();
    if (!weekLoc) return;
    const weeks = getWeeks(year, month);
    const week = weeks[wi];
    if (!week) return;
    week.forEach(date => {
      const dk = dkFromDate(date);
      if (!(DATA[dayLocationKey(dk)] || '').trim()) {
        DATA[dayLocationKey(dk)] = weekLoc;
        changed = true;
      }
    });
  });
  if (changed) {
    Object.keys(DATA).forEach(k => {
      if (k.endsWith('-location') && DATA[k]) markDirty(k);
    });
    saveData(DATA);
  }
}

function cellDayMetaHtml(key) {
  const loc = getDayLocation(key).trim();
  const note = (DATA[key] || '').trim();
  let html = taskChipsHtmlForDay(key, 2);
  if (loc) html += `<div class="cell-loc">${escHtml(loc)}</div>`;
  if (note) html += `<div class="cell-note">${escHtml(note)}</div>`;
  return html;
}

function bindDayFieldInputs(root) {
  root.querySelectorAll('[data-day-field]').forEach(inp => {
    inp.addEventListener('input', e => {
      const k = e.target.dataset.key;
      const field = e.target.dataset.dayField;
      if (!k || !field) return;
      if (field === 'location') setDayLocation(k, e.target.value);
      else if (field === 'note') { DATA[k] = e.target.value; markDirty(k); saveData(DATA); }
    });
  });
}

function dkToDateInput(dkKey) {
  if (!dkKey) return '';
  const p = dkKey.split('-');
  if (p.length !== 3) return '';
  return `${p[0]}-${String(+p[1] + 1).padStart(2, '0')}-${p[2]}`;
}

function dateInputToDk(val) {
  if (!val) return '';
  const p = val.split('-');
  if (p.length !== 3) return '';
  return `${p[0]}-${String(+p[1] - 1).padStart(2, '0')}-${p[2]}`;
}

function compareDayKeys(a, b) { return String(a).localeCompare(String(b)); }
function isDayKeyBefore(a, b) { return compareDayKeys(a, b) < 0; }

function isTodoOverdue(t) {
  return !!(t && !t.done && t.dueBy && isDayKeyBefore(t.dueBy, dkFromDate(today)));
}

function getDashUpcomingTasks() {
  migrateDashPrefsIntoData();
  try { return DATA[DATA_KEY_DASH_UPCOMING_TASKS] === '1'; } catch (_) { return false; }
}

function onDashUpcomingTasksChange(el) {
  try {
    if (el.checked) {
      DATA[DATA_KEY_DASH_UPCOMING_TASKS] = '1';
      markDirty(DATA_KEY_DASH_UPCOMING_TASKS);
    } else {
      delete DATA[DATA_KEY_DASH_UPCOMING_TASKS];
      markDeleted(DATA_KEY_DASH_UPCOMING_TASKS);
    }
  } catch (_) {}
  saveData(DATA);
  refreshTodoViews();
}

function dashActiveTodosRemain() {
  const pid = getDashboardTop3ProjectId();
  return sortActiveTodosForPlate(pid, getTodos()).length > 0;
}

function timeToMinutes(t) {
  if (!t) return null;
  const p = /^(\d{1,2}):(\d{2})/.exec(String(t).trim());
  if (!p) return null;
  return (+p[1]) * 60 + (+p[2]);
}

function scheduleSlotLabels() {
  const out = [];
  for (let h = SCHED_START_H; h < SCHED_END_H; h++) {
    for (let m = 0; m < 60; m += SCHED_SLOT_MIN) {
      out.push({
        h, m,
        label: formatTime(`${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`),
      });
    }
  }
  return out;
}

function slotIndexFromMinutes(mins) {
  const start = SCHED_START_H * 60;
  const end = SCHED_END_H * 60;
  if (mins == null || mins < start || mins >= end) return -1;
  return Math.floor((mins - start) / SCHED_SLOT_MIN);
}

function todoCalendarItemsForDay(dayKey) {
  const todayKey = dkFromDate(today);
  return getTodos().filter(t => {
    if (!t || t.done || !t.dueBy) return false;
    if (t.dueBy === dayKey) return true;
    if (isTodoOverdue(t) && dayKey === todayKey) return true;
    return false;
  }).sort((a, b) => {
    if (isTodoOverdue(a) && !isTodoOverdue(b)) return -1;
    if (!isTodoOverdue(a) && isTodoOverdue(b)) return 1;
    return compareDayKeys(a.dueBy, b.dueBy);
  });
}

function taskChipsHtmlForDay(dayKey, maxVisible) {
  const tasks = todoCalendarItemsForDay(dayKey);
  if (!tasks.length) return '';
  const todayKey = dkFromDate(today);
  const cap = maxVisible == null ? tasks.length : maxVisible;
  const visible = tasks.slice(0, cap);
  const extra = tasks.length - visible.length;
  const chips = visible.map(t => {
    const overdue = isTodoOverdue(t);
    const pastDue = t.dueBy === dayKey && isDayKeyBefore(dayKey, todayKey);
    const cls = ['task-chip', overdue && dayKey === todayKey ? 'is-overdue' : '', pastDue ? 'is-due-past' : ''].filter(Boolean).join(' ');
    const label = overdue && dayKey === todayKey
      ? `⚠ ${t.text} (was due ${dkToDateInput(t.dueBy)})`
      : t.text;
    return `<div class="${cls}" data-todo-id="${esc(t.id)}" title="Open Todo">${escHtml(label)}</div>`;
  }).join('');
  const more = extra > 0 ? `<div class="task-chip-more">+${extra} more task${extra === 1 ? '' : 's'}</div>` : '';
  return `<div class="cell-tasks">${chips}${more}</div>`;
}

function setTodoDueBy(id, dateInputVal) {
  const todos = getTodos();
  const t = todos.find(x => x.id === id);
  if (!t) return;
  const dk = dateInputToDk(dateInputVal);
  if (dk) t.dueBy = dk;
  else t.dueBy = null;
  touchTodo(t);
  saveTodos(todos);
  refreshTodoViews();
}

function setTodoBlockField(id, field, val) {
  const todos = getTodos();
  const t = todos.find(x => x.id === id);
  if (!t) return;
  if (field === 'blockDate') {
    const dk = dateInputToDk(val);
    if (dk) t.blockDate = dk;
    else t.blockDate = null;
  } else if (field === 'blockStart' || field === 'blockEnd') {
    if (val) {
      t[field] = val;
      if (!t.blockDate) t.blockDate = t.dueBy || dkFromDate(today);
    } else t[field] = null;
  }
  if (!t.blockStart && !t.blockEnd) t.blockDate = null;
  touchTodo(t);
  saveTodos(todos);
  refreshTodoViews();
}

function assignTodoBlockFromSlot(todoId, dayKey, timeStr) {
  const todos = getTodos();
  const t = todos.find(x => x.id === todoId);
  if (!t) return;
  t.blockDate = dayKey;
  t.blockStart = timeStr;
  const sm = timeToMinutes(timeStr);
  const em = sm != null ? sm + 60 : null;
  t.blockEnd = em != null
    ? `${String(Math.floor(em / 60)).padStart(2, '0')}:${String(em % 60).padStart(2, '0')}`
    : '';
  touchTodo(t);
  saveTodos(todos);
  refreshTodoViews();
}

function openTodoFromTaskChip(todoId) {
  const t = getTodos().find(x => x.id === todoId);
  if (t && t.projectId) {
    selectedTodoProjectId = t.projectId;
    try { localStorage.setItem('fp-todo-project', t.projectId); } catch (_) {}
  }
  setView('todo');
}

function scheduleItemsForDay(dayKey, date) {
  const items = [];
  getEventsForDay(date).forEach(ev => {
    const sm = timeToMinutes(ev.startTime);
    let em = timeToMinutes(ev.endTime);
    if (sm != null && (em == null || em <= sm)) em = sm + 30;
    items.push({ kind: 'event', sm, em, ev });
  });
  getFlights(dayKey).forEach(fl => {
    const sm = timeToMinutes(fl.departureTime);
    items.push({ kind: 'flight', sm, em: sm != null ? sm + 30 : null, fl });
  });
  getTodos().forEach(t => {
    if (t.done) return;
    if (t.blockDate === dayKey && t.blockStart) {
      const sm = timeToMinutes(t.blockStart);
      let em = timeToMinutes(t.blockEnd);
      if (sm != null && (em == null || em <= sm)) em = sm + 60;
      items.push({ kind: 'block', sm, em, t });
    }
  });
  if (dayKey === dkFromDate(today)) {
    getTodos().forEach(t => {
      if (t.done || !isTodoOverdue(t)) return;
      if (t.blockDate === dayKey && t.blockStart) return;
      items.push({ kind: 'overdue', sm: 8 * 60, em: 8 * 60 + 30, t });
    });
  }
  return items;
}

function renderScheduleItemMarkup(item) {
  if (item.kind === 'event') {
    const ev = item.ev;
    return `<div class="sched-item is-event" title="${escHtml(ev.title || 'Event')}">
      <span class="sched-item-title">${escHtml(ev.title || 'Event')}</span>
      <span class="sched-item-meta">${escHtml(formatTimeRange(ev.startTime, ev.endTime))}</span>
    </div>`;
  }
  if (item.kind === 'flight') {
    const fl = item.fl;
    return `<div class="sched-item is-flight"><span class="sched-item-title">✈ ${escHtml(fl.flightNum || 'Flight')}</span></div>`;
  }
  if (item.kind === 'block') {
    const t = item.t;
    return `<div class="sched-item is-block" data-todo-id="${esc(t.id)}" title="Work block">
      <span class="sched-item-title">${escHtml(t.text)}</span>
      <span class="sched-item-meta">${escHtml(formatTimeRange(t.blockStart, t.blockEnd))}</span>
    </div>`;
  }
  const t = item.t;
  return `<div class="sched-item is-overdue" data-todo-id="${esc(t.id)}" title="Overdue">
    <span class="sched-item-title">⚠ ${escHtml(t.text)}</span>
    <span class="sched-item-meta">Due ${escHtml(dkToDateInput(t.dueBy))}</span>
  </div>`;
}

function buildScheduleColumn(dayKey, date, opts) {
  const slots = scheduleSlotLabels();
  const rows = slots.length;
  const hdr = opts && opts.header
    ? `<div class="sched-col-hdr${isToday(date) ? ' is-today' : ''}">${escHtml(opts.header)}</div>`
    : '';
  let slotsHtml = '';
  slots.forEach((s, i) => {
    slotsHtml += `<div class="sched-slot" data-dk="${esc(dayKey)}" data-time="${String(s.h).padStart(2, '0')}:${String(s.m).padStart(2, '0')}"><span class="sched-time">${i % 2 === 0 ? s.label : ''}</span></div>`;
  });
  let itemsHtml = '';
  scheduleItemsForDay(dayKey, date).forEach(item => {
    const si = slotIndexFromMinutes(item.sm);
    if (si < 0) return;
    let ei = item.em != null ? slotIndexFromMinutes(item.em) : si + 1;
    if (ei <= si) ei = si + 1;
    const span = Math.min(ei - si, rows - si);
    itemsHtml += `<div class="sched-item-wrap" style="grid-row:${si + 1} / span ${span}">${renderScheduleItemMarkup(item)}</div>`;
  });
  return `${hdr}<div class="sched-col-inner" style="--sched-rows:${rows}">${slotsHtml}<div class="sched-items">${itemsHtml}</div></div>`;
}

function buildScheduleTimeGutter() {
  const slots = scheduleSlotLabels();
  const rows = slots.length;
  let html = `<div class="sched-col-inner" style="--sched-rows:${rows}">`;
  slots.forEach((s, i) => {
    html += `<div class="sched-slot"><span class="sched-time">${i % 2 === 0 ? s.label : ''}</span></div>`;
  });
  html += '</div>';
  return html;
}

function wireScheduleGrid(root) {
  root.querySelectorAll('.sched-slot[data-dk]').forEach(slot => {
    slot.addEventListener('click', () => {
      const dk = slot.dataset.dk;
      const time = slot.dataset.time;
      if (!dk || !time) return;
      const active = getTodos().filter(t => !t.done);
      if (!active.length) return;
      const names = active.slice(0, 12).map((t, i) => `${i + 1}. ${t.text.slice(0, 40)}`).join('\n');
      const pick = prompt(`Block time ${time} — enter task number:\n${names}`);
      if (pick == null || pick.trim() === '') return;
      const idx = parseInt(pick, 10) - 1;
      if (isNaN(idx) || idx < 0 || idx >= active.length) return;
      assignTodoBlockFromSlot(active[idx].id, dk, time);
    });
  });
  root.querySelectorAll('.sched-item[data-todo-id], .task-chip[data-todo-id]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      openTodoFromTaskChip(el.dataset.todoId);
    });
  });
}

function todoDueHtml(id, dueBy) {
  return `<input type="date" class="todo-due-input" aria-label="Due date" value="${esc(dkToDateInput(dueBy))}"
    onchange="setTodoDueBy(${JSON.stringify(id)}, this.value)">`;
}

function todoBlockHtml(id, t) {
  const blockDate = t.blockDate || t.dueBy || '';
  return `<label>Work</label>
    <div class="todo-block-times">
      <input type="time" class="todo-block-start" aria-label="Block start" value="${esc(t.blockStart || '')}"
        onchange="setTodoBlockField(${JSON.stringify(id)}, 'blockStart', this.value)">
      <span>–</span>
      <input type="time" class="todo-block-end" aria-label="Block end" value="${esc(t.blockEnd || '')}"
        onchange="setTodoBlockField(${JSON.stringify(id)}, 'blockEnd', this.value)">
    </div>
    <input type="date" class="todo-block-date" aria-label="Block date" title="Work block day"
      value="${esc(dkToDateInput(blockDate))}"
      onchange="setTodoBlockField(${JSON.stringify(id)}, 'blockDate', this.value)">`;
}

function todoDisplaySort(a, b, order) {
  const oa = isTodoOverdue(a) ? 0 : (a.dueBy ? 1 : 2);
  const ob = isTodoOverdue(b) ? 0 : (b.dueBy ? 1 : 2);
  if (oa !== ob) return oa - ob;
  if (a.dueBy && b.dueBy && a.dueBy !== b.dueBy) return compareDayKeys(a.dueBy, b.dueBy);
  const da = importanceTier(a), db = importanceTier(b);
  if (da !== db) return da - db;
  return order.indexOf(a) - order.indexOf(b);
}

function dashTodayTasksHtml(todayKey) {
  const overdue = getTodos().filter(t => isTodoOverdue(t));
  const dueToday = getTodos().filter(t => !t.done && t.dueBy === todayKey && !isTodoOverdue(t));
  if (!overdue.length && !dueToday.length) return '';
  const shame = overdue.length > 0;
  const rows = [
    ...overdue.map(t => `<div class="task-chip is-overdue" data-todo-id="${esc(t.id)}">⚠ ${escHtml(t.text)} · was due ${escHtml(dkToDateInput(t.dueBy))}</div>`),
    ...dueToday.map(t => `<div class="task-chip" data-todo-id="${esc(t.id)}">${escHtml(t.text)} · due today</div>`),
  ].join('');
  return `<div class="dash-today-tasks${shame ? ' is-shame' : ''}">
    <div class="dash-today-tasks-label">${shame ? 'Overdue & due today' : 'Due today'}</div>
    ${rows}
  </div>`;
}

function dashUpcomingTaskRows(maxDays) {
  if (!getDashUpcomingTasks() || dashActiveTodosRemain()) return [];
  const todayKey = dkFromDate(today);
  const rows = [];
  getTodos().forEach(t => {
    if (t.done || !t.dueBy || isTodoOverdue(t)) return;
    if (isDayKeyBefore(t.dueBy, todayKey)) return;
    const parts = t.dueBy.split('-');
    const d = new Date(+parts[0], +parts[1], +parts[2]);
    const diff = Math.round((d - today) / 86400000);
    if (diff < 1 || diff > (maxDays || 28)) return;
    rows.push({
      sort: d.getTime() + 86400000 - 1,
      key: t.dueBy,
      date: d,
      label: t.text,
      timeStr: 'Due',
      recurring: false,
      isTask: true,
      todoId: t.id,
    });
  });
  rows.sort((a, b) => a.sort - b.sort);
  return rows;
}
function dateStr(date) { return dkFromDate(date); }
// Proper ISO date (YYYY-MM-DD with 1-indexed month) for use in <input type="date">
function isoDateStr(date) {
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}

function isPast(date)  { const d = new Date(date); d.setHours(0,0,0,0); return d < today; }
function isToday(date) { const d = new Date(date); d.setHours(0,0,0,0); return d.getTime() === today.getTime(); }

function getWeeks(year, month) {
  const last = new Date(year, month+1, 0).getDate();
  const weeks = []; let wk = [];
  for (let d = 1; d <= last; d++) {
    const date = new Date(year, month, d);
    if (wk.length && date.getDay() === 0) { weeks.push(wk); wk = []; }
    wk.push(date);
  }
  if (wk.length) weeks.push(wk);
  return weeks;
}

function getWeekDates(ws) {
  return Array.from({length:7}, (_,i) => { const d = new Date(ws); d.setDate(ws.getDate()+i); return d; });
}

function getWeekIndexForDate(date) {
  const weeks = getWeeks(date.getFullYear(), date.getMonth());
  return weeks.findIndex(w => w.some(d => d.getDate() === date.getDate()));
}

function getEvents(key) { try { return JSON.parse(DATA[key+'-events'] || '[]'); } catch(e) { return []; } }
function saveEvents(key, evs) {
  const dk = key + '-events';
  DATA[dk] = JSON.stringify(evs);
  markDirty(dk);
  saveData(DATA);
}

function getRecurring()     { try { return JSON.parse(DATA['__recurring__'] || '[]'); } catch(e) { return []; } }
function saveRecurring(arr) {

  markDirty('__recurring__');
  saveData(DATA);
}

function getMultiday() {
  try { return JSON.parse(DATA[MULTIDAY_SYNC_KEY] || '[]'); } catch (e) { return []; }
}
function saveMultiday(arr) {
  DATA[MULTIDAY_SYNC_KEY] = JSON.stringify(arr);
  markDirty(MULTIDAY_SYNC_KEY);
  saveData(DATA);
}

/** Inclusive day-key range covers this calendar date. */
function multidayApplies(ev, date) {
  if (!ev || !ev.startDayKey || !ev.endDayKey) return false;
  const k = dkFromDate(date);
  return compareDayKeys(ev.startDayKey, k) <= 0 && compareDayKeys(k, ev.endDayKey) <= 0;
}

function dayKeyToLocalDate(dkKey) {
  const p = String(dkKey || '').split('-').map(Number);
  if (p.length !== 3 || p.some(n => !Number.isFinite(n))) return null;
  return new Date(p[0], p[1], p[2]);
}

function formatMultidayRangeLabel(ev) {
  if (!ev || !ev.startDayKey || !ev.endDayKey) return '';
  const s = dayKeyToLocalDate(ev.startDayKey);
  const e = dayKeyToLocalDate(ev.endDayKey);
  if (!s || !e) return '';
  if (ev.startDayKey === ev.endDayKey) {
    return s.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }
  if (s.getMonth() === e.getMonth() && s.getFullYear() === e.getFullYear()) {
    return `${s.toLocaleDateString('en-US', { month: 'short' })} ${s.getDate()}–${e.getDate()}`;
  }
  return `${s.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}–${e.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}`;
}

function normalizeMultidayRange(ev) {
  if (!ev.startDayKey) ev.startDayKey = modalDk || '';
  if (!ev.endDayKey) ev.endDayKey = ev.startDayKey;
  if (ev.startDayKey && ev.endDayKey && compareDayKeys(ev.startDayKey, ev.endDayKey) > 0) {
    const tmp = ev.startDayKey;
    ev.startDayKey = ev.endDayKey;
    ev.endDayKey = tmp;
  }
  ev.startTime = '';
  ev.endTime = '';
}

function isUntimedAllDayEvent(ev) {
  return Boolean(ev && (ev.title || ev.business) && !ev.startTime && !ev.endTime);
}

/** Single-day all-day events for a date (from that day's events array only). */
function getSingleDayAllDayBannerEvents(date) {
  const key = dkFromDate(date);
  return getEvents(key)
    .filter(isUntimedAllDayEvent)
    .map(ev => ({
      ...ev,
      _allday: true,
      _multiday: false,
      startDayKey: key,
      endDayKey: key,
    }));
}

/** Build 7 slots (Sun–Sat) for a month-grid week; missing days are null (empty padding). */
function weekSlotsFromMonthWeek(weekDates) {
  const slots = [null, null, null, null, null, null, null];
  (weekDates || []).forEach(date => {
    if (date) slots[date.getDay()] = date;
  });
  return slots;
}

/**
 * Clip an inclusive day-key range to one week row.
 * Returns { startCol, endColInclusive, continuesLeft, continuesRight, ev } or null.
 */
function allDaySegmentForWeek(ev, slots) {
  if (!ev || !ev.startDayKey || !ev.endDayKey) return null;
  let startCol = -1;
  let endCol = -1;
  for (let c = 0; c < 7; c++) {
    if (!slots[c]) continue;
    if (!multidayApplies(ev, slots[c])) continue;
    if (startCol < 0) startCol = c;
    endCol = c;
  }
  if (startCol < 0) return null;

  const visibleDates = slots.filter(Boolean);
  const weekFirst = visibleDates[0];
  const weekLast = visibleDates[visibleDates.length - 1];
  const continuesLeft = compareDayKeys(ev.startDayKey, dkFromDate(weekFirst)) < 0;
  const continuesRight = compareDayKeys(dkFromDate(weekLast), ev.endDayKey) < 0;
  return {
    ev,
    startCol,
    endCol,
    continuesLeft,
    continuesRight,
  };
}

/** Greedy lane packing so overlapping banners stack instead of colliding. */
function assignAllDayBannerLanes(segments) {
  const sorted = [...segments].sort((a, b) => {
    if (a.startCol !== b.startCol) return a.startCol - b.startCol;
    return (b.endCol - b.startCol) - (a.endCol - a.startCol);
  });
  const laneEnds = []; // exclusive end col occupied per lane
  sorted.forEach(seg => {
    let lane = laneEnds.findIndex(end => end <= seg.startCol);
    if (lane < 0) {
      lane = laneEnds.length;
      laneEnds.push(seg.endCol + 1);
    } else {
      laneEnds[lane] = seg.endCol + 1;
    }
    seg.lane = lane;
  });
  return { segments: sorted, laneCount: laneEnds.length };
}

function collectAllDaySegmentsForWeek(slots) {
  const byId = new Map();

  getMultiday().forEach(ev => {
    if (!ev || !ev.id || !(ev.title || ev.business)) return;
    const seg = allDaySegmentForWeek({
      ...ev,
      _multiday: true,
      _allday: true,
    }, slots);
    if (seg) byId.set(String(ev.id), seg);
  });

  slots.forEach(date => {
    if (!date) return;
    getSingleDayAllDayBannerEvents(date).forEach(ev => {
      const id = String(ev.id);
      if (byId.has(id)) return;
      const seg = allDaySegmentForWeek(ev, slots);
      if (seg) byId.set(id, seg);
    });
  });

  return assignAllDayBannerLanes([...byId.values()]);
}

function renderAllDayBannerEl(seg) {
  const ev = seg.ev;
  const el = document.createElement('div');
  el.className = 'allday-banner'
    + (ev._multiday ? ' is-multiday' : '')
    + (seg.continuesLeft ? ' continues-left' : '')
    + (seg.continuesRight ? ' continues-right' : '');
  el.style.gridColumn = `${seg.startCol + 1} / ${seg.endCol + 2}`;
  el.style.gridRow = String((seg.lane || 0) + 1);
  el.title = ev._multiday
    ? `${ev.title || 'Untitled'} · ${formatMultidayRangeLabel(ev)}`
    : (ev.title || 'Untitled');
  el.innerHTML = `<span class="allday-banner-title">${escHtml(ev.title || 'Untitled')}</span>`;
  el.addEventListener('click', e => {
    e.stopPropagation();
    const start = dayKeyToLocalDate(ev.startDayKey);
    if (start) openModal(ev.startDayKey, start);
  });
  return el;
}

function getFlights(key) { try { return JSON.parse(DATA[key+'-flights'] || '[]'); } catch(e) { return []; } }
function saveFlights(key, arr) {
  const dk = key + '-flights';
  const normalized = arr.map((f, i) => {
    if (!f) return f;
    if (f.id) return f;
    return { ...f, id: 'fl-' + Date.now().toString(36) + '-' + i + '-' + Math.random().toString(36).slice(2, 6) };
  });
  DATA[dk] = JSON.stringify(normalized);
  markDirty(dk);
  saveData(DATA);
}

function recurringApplies(ev, date) {
  const d = new Date(date); d.setHours(0,0,0,0);
  if (!ev.startDate) return false;
  const start = new Date(ev.startDate); start.setHours(0,0,0,0);
  if (d < start) return false;
  if (ev.endDate) { const end = new Date(ev.endDate); end.setHours(0,0,0,0); if (d > end) return false; }
  switch (ev.pattern) {
    case 'daily': return true;
    case 'weekly': return (ev.days||[]).includes(d.getDay());
    case 'biweekly': {
      if (!(ev.days||[]).includes(d.getDay())) return false;
      const diffWeeks = Math.round((getWeekStart(d) - getWeekStart(start)) / (7*24*60*60*1000));
      return diffWeeks % 2 === 0;
    }
    case 'monthly': {
      const lastOfMonth = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
      if (ev.monthDays && ev.monthDays.length) {
        return ev.monthDays.some(md => md === -1 ? d.getDate() === lastOfMonth : d.getDate() === md);
      }
      return d.getDate() === start.getDate(); // legacy: use startDate day
    }
    default: return false;
  }
}

function getEventsForDay(date) {
  const key = dkFromDate(date);
  const regular   = getEvents(key).map(ev => ({...ev, _recurring: false, _multiday: false}));
  const recurring = getRecurring().filter(ev => recurringApplies(ev, date))
                                  .map(ev => ({...ev, _recurring: true, _recurringId: ev.id, _multiday: false}));
  const multiday  = getMultiday().filter(ev => multidayApplies(ev, date))
                                  .map(ev => ({...ev, _multiday: true, _recurring: false, startTime: '', endTime: ''}));
  return [...multiday, ...regular, ...recurring];
}

function recurDescription(ev) {
  switch(ev.pattern) {
    case 'daily':    return 'Repeats daily';
    case 'weekly':   return `Repeats weekly on ${(ev.days||[]).map(d=>DAYS[d]).join(', ') || '—'}`;
    case 'biweekly': return `Repeats every other week on ${(ev.days||[]).map(d=>DAYS[d]).join(', ') || '—'}`;
    case 'monthly': {
      if (ev.monthDays && ev.monthDays.length) {
        const labels = ev.monthDays.map(d => {
          if (d === -1) return 'last day';
          const s = ['th','st','nd','rd']; const v = d%100;
          return `${d}${s[(v-20)%10]||s[v]||s[0]}`;
        });
        return `Repeats monthly on the ${labels.join(' & ')}`;
      }
      if (!ev.startDate) return 'Repeats monthly';
      const n = new Date(ev.startDate).getDate();
      const s = ['th','st','nd','rd']; const v = n%100;
      return `Repeats monthly on the ${n}${s[(v-20)%10]||s[v]||s[0]}`;
    }
    default: return 'Repeats';
  }
}

function formatTime(t) {
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  if (isNaN(h)) return t;
  const ap = h >= 12 ? 'pm' : 'am'; const h12 = h%12||12;
  return m ? `${h12}:${String(m).padStart(2,'0')}${ap}` : `${h12}${ap}`;
}
function formatTimeRange(s, e) {
  if (!s && !e) return '';
  if (s && e)   return `${formatTime(s)}–${formatTime(e)}`;
  return formatTime(s||e);
}

function getDominantStatus(days) {
  const counts = {};
  days.forEach(d => { const s = DATA[dkFromDate(d)+'-status']; if (s) counts[s] = (counts[s]||0)+1; });
  if (!Object.keys(counts).length) return null;
  return Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
}

function cycleStatus(key) {
  const s = DATA[key+'-status']||null; const idx = STATUSES.indexOf(s);
  DATA[key+'-status'] = idx >= STATUSES.length-1 ? null : STATUSES[idx+1];
  markDirty(key + '-status');
  saveData(DATA); render();
}

function setStatus(key, status) {
  DATA[key+'-status'] = DATA[key+'-status'] === status ? null : status;
  markDirty(key + '-status');
  saveData(DATA); render();
}

function esc(str) { return (str||'').replace(/"/g,'&quot;'); }
function escHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function chipHTML(ev, key) {
  const range = ev._multiday ? formatMultidayRangeLabel(ev) : '';
  const t = ev._multiday ? range : formatTimeRange(ev.startTime, ev.endTime);
  const cls = ev._multiday ? ' is-multiday' : (ev._recurring ? ' is-recurring' : '');
  const icon = ev._multiday ? '<span class="chip-recur">▬</span>' : (ev._recurring ? '<span class="chip-recur">↻</span>' : '');
  return `<div class="event-chip${cls}" data-key="${key}">
    ${icon}<span class="chip-title">${escHtml(ev.title||'Untitled')}</span>
    ${t ? `<span class="chip-time">${escHtml(t)}</span>` : ''}
  </div>`;
}
function cellChipHTML(ev) {
  const range = ev._multiday ? formatMultidayRangeLabel(ev) : '';
  const t = ev._multiday ? range : formatTimeRange(ev.startTime, ev.endTime);
  const cls = ev._multiday ? ' is-multiday' : (ev._recurring ? ' is-recurring' : '');
  const prefix = ev._multiday ? '▬ ' : (ev._recurring ? '↻ ' : '');
  return `<div class="cell-event-chip${cls}">${prefix}${escHtml(ev.title||'Untitled')}${t?`<span class="chip-time">${escHtml(t)}</span>`:''}</div>`;
}
function flightChipHTML(fl, key) {
  const route = fl.originCode && fl.destCode ? ` ${fl.originCode}→${fl.destCode}` : '';
  const time  = fl.departureTime ? ` ${fl.departureTime}` : '';
  return `<div class="flight-chip" data-key="${key}">✈ ${fl.flightNum||'?'}${route}${time}</div>`;
}
function cellFlightChipHTML(fl) {
  const route = fl.originCode && fl.destCode ? ` ${fl.originCode}→${fl.destCode}` : '';
  return `<div class="cell-flight-chip">✈ ${fl.flightNum||'?'}${route}</div>`;
}

/** Human-readable day label for Home “Coming up” list */
function dashRelativeDayLabel(date) {
  const k = dkFromDate(date);
  if (k === dkFromDate(today)) return 'Today';
  const tmr = new Date(today);
  tmr.setDate(tmr.getDate() + 1);
  if (k === dkFromDate(tmr)) return 'Tomorrow';
  return `${DAYS[date.getDay()]}, ${MONTHS_SHORT[date.getMonth()]} ${date.getDate()}`;
}

/** Sortable rows: events + flights for the next N days (inclusive of today). */
function dashBuildUpcomingList(maxDaysInclusive, maxItems) {
  const raw = [];
  for (let i = 0; i <= maxDaysInclusive; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() + i);
    const key = dkFromDate(d);
    const dayStart = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    getEventsForDay(d).forEach(ev => {
      let ms = dayStart;
      if (ev.startTime) {
        const p = /^(\d{1,2}):(\d{2})/.exec(String(ev.startTime).trim());
        if (p) ms += (+p[1] * 60 + +p[2]) * 60000;
      }
      raw.push({
        sort: ms,
        key,
        date: d,
        label: ev.title || 'Untitled',
        timeStr: formatTimeRange(ev.startTime, ev.endTime),
        recurring: !!ev._recurring,
      });
    });
    getFlights(key).forEach(fl => {
      let ms = dayStart;
      if (fl.departureTime) {
        const p = /^(\d{1,2}):(\d{2})/.exec(String(fl.departureTime).trim());
        if (p) ms += (+p[1] * 60 + +p[2]) * 60000;
      }
      const route = fl.originCode && fl.destCode ? `${fl.originCode}→${fl.destCode}` : '';
      const label = `✈ ${fl.flightNum || 'Flight'}${route ? ' ' + route : ''}`;
      raw.push({
        sort: ms,
        key,
        date: d,
        label,
        timeStr: fl.departureTime ? formatTime(String(fl.departureTime).trim().slice(0, 5)) : '',
        recurring: false,
      });
    });
  }
  raw.sort((a, b) => a.sort - b.sort);
  return raw.slice(0, maxItems);
}

// ── LIST VIEW ────────────────────────────────────────────────────────────────
function renderList() {
  const {year, month} = cur;
  const weeks = getWeeks(year, month);
  const el = document.getElementById('list-view');
  el.innerHTML = '';

  weeks.forEach((week, wi) => {
    const block = document.createElement('div'); block.className = 'week-block';
    const daysCol = document.createElement('div'); daysCol.className = 'days-col';

    week.forEach(date => {
      const dow = date.getDay(); const key = dkFromDate(date);
      const status = DATA[key+'-status']||null;
      const note = DATA[key]||'';
      const location = getDayLocation(key);
      const events = getEventsForDay(date);

      const row = document.createElement('div');
      let cls = 'day-row';
      if (dow===0||dow===6) cls += ' weekend';
      if (isToday(date))    cls += ' is-today';
      if (isPast(date))     cls += ' past';
      if (status)           cls += ' status-'+status;
      row.className = cls;

      const tagCls = status ? `tag-btn t-${status}` : 'tag-btn';
      const tagLabel = status ? STATUS_LABELS[status] : 'Tag';
      const chipsHTML   = events.map(ev => chipHTML(ev, key)).join('');
      const flights     = getFlights(key);
      const flChipsHTML = flights.map(fl => flightChipHTML(fl, key)).join('');

      row.innerHTML = `
        <div class="day-label">${DAYS[dow]} <span class="daynum">${date.getDate()}</span></div>
        <div class="day-content">
          <input class="day-loc" placeholder="Location…" value="${esc(location)}" data-key="${key}" data-day-field="location" />
          <input class="day-note" placeholder="Note…" value="${esc(note)}" data-key="${key}" data-day-field="note" />
          <div class="event-chips">${chipsHTML}${flChipsHTML}</div>
          <button class="add-event-link" data-key="${key}">+ event</button>
        </div>
        <div class="day-row-right">
          <button class="${tagCls}" data-key="${key}">${tagLabel}</button>
        </div>
      `;
      bindDayFieldInputs(row);
      row.querySelector('.tag-btn').addEventListener('click', e => cycleStatus(e.target.dataset.key));
      row.querySelector('.add-event-link').addEventListener('click', () => openModal(key, date, true));
      row.querySelectorAll('.event-chip').forEach(chip => chip.addEventListener('click', () => openModal(key, date)));
      row.querySelectorAll('.flight-chip').forEach(chip => chip.addEventListener('click', () => openModal(key, date)));
      daysCol.appendChild(row);
    });

    block.appendChild(daysCol); el.appendChild(block);
  });
}

// ── GRID VIEW ────────────────────────────────────────────────────────────────
function renderGrid() {
  const {year, month} = cur;
  const weeks = getWeeks(year, month);
  const el = document.getElementById('grid-view');
  el.innerHTML = '';

  const hdrs = document.createElement('div'); hdrs.className = 'grid-dow-headers';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => {
    const h = document.createElement('div'); h.className = 'dow-hdr'; h.textContent = d; hdrs.appendChild(h);
  });
  el.appendChild(hdrs);

  const weeksEl = document.createElement('div'); weeksEl.className = 'grid-weeks';

  weeks.forEach((week) => {
    const startDow = week[0].getDay();
    const endDow = week[week.length - 1].getDay();
    const slots = weekSlotsFromMonthWeek(week);
    const { segments, laneCount } = collectAllDaySegmentsForWeek(slots);

    const weekRow = document.createElement('div');
    weekRow.className = 'grid-week';
    weekRow.style.setProperty('--allday-lanes', String(laneCount));

    for (let i = 0; i < startDow; i++) {
      const c = document.createElement('div');
      c.className = 'grid-cell empty';
      weekRow.appendChild(c);
    }

    week.forEach(date => {
      const dow = date.getDay();
      const key = dkFromDate(date);
      const status = DATA[key + '-status'] || null;
      // Timed (+ recurring timed) only — all-day / multi-day render in the banner layer.
      const timedEvents = getEventsForDay(date).filter(ev =>
        !ev._multiday && !isUntimedAllDayEvent(ev)
      );
      const flights = getFlights(key);
      const cell = document.createElement('div');
      let cls = 'grid-cell';
      if (dow === 0 || dow === 6) cls += ' weekend';
      if (isToday(date)) cls += ' is-today';
      if (isPast(date)) cls += ' past';
      if (status) cls += ' status-' + status;
      cell.className = cls;
      cell.innerHTML = `
        <div class="cell-num">${date.getDate()}</div>
        ${cellDayMetaHtml(key)}
        ${timedEvents.map(ev => cellChipHTML(ev)).join('')}
        ${flights.map(fl => cellFlightChipHTML(fl)).join('')}
        ${status ? `<div class="cell-tag t-${status}">${STATUS_LABELS[status]}</div>` : ''}
      `;
      cell.addEventListener('click', (e) => {
        if (e.target.closest('.task-chip')) return;
        openModal(key, date);
      });
      weekRow.appendChild(cell);
    });

    for (let i = endDow + 1; i < 7; i++) {
      const c = document.createElement('div');
      c.className = 'grid-cell empty';
      weekRow.appendChild(c);
    }

    if (segments.length) {
      const banners = document.createElement('div');
      banners.className = 'grid-week-banners';
      segments.forEach(seg => banners.appendChild(renderAllDayBannerEl(seg)));
      weekRow.appendChild(banners);
    }

    weeksEl.appendChild(weekRow);
  });
  el.appendChild(weeksEl);
  el.querySelectorAll('.task-chip[data-todo-id]').forEach(chip => {
    chip.addEventListener('click', e => {
      e.stopPropagation();
      openTodoFromTaskChip(chip.dataset.todoId);
    });
  });
}

// ── WEEK LIST VIEW ───────────────────────────────────────────────────────────
function renderWeekList() {
  const dates = getWeekDates(curWeekStart);
  const el = document.getElementById('week-list-view'); el.innerHTML = '';

  dates.forEach(date => {
    const dow = date.getDay(); const key = dkFromDate(date);
    const status = DATA[key+'-status']||null;
    const note = DATA[key]||'';
    const location = getDayLocation(key);
    const events = getEventsForDay(date);

    const block = document.createElement('div');
    block.className = 'week-day-block' + (isPast(date) ? ' past' : '');
    let hdrCls = 'week-day-header';
    if (isToday(date)) hdrCls += ' is-today';
    else if (dow===0||dow===6) hdrCls += ' weekend';
    if (status) hdrCls += ' status-'+status;

    const tagCls = status ? `tag-btn t-${status}` : 'tag-btn';
    const tagLabel = status ? STATUS_LABELS[status] : 'Tag';

    block.innerHTML = `
      <div class="${hdrCls}">
        <div class="wdh-date">${date.getDate()}</div>
        <div class="wdh-label">${DAYS[dow]}, ${MONTHS_SHORT[date.getMonth()]}</div>
        <div style="margin-left:auto;display:flex;gap:8px;align-items:center;">
          <button class="${tagCls}" data-key="${key}">${tagLabel}</button>
        </div>
      </div>
        <div class="week-day-body">
        <input class="week-loc-input" placeholder="Location…" value="${esc(location)}" data-key="${key}" data-day-field="location" />
        <input class="week-note-input" placeholder="Note…" value="${esc(note)}" data-key="${key}" data-day-field="note" />
        <div class="event-chips">${events.map(ev=>chipHTML(ev,key)).join('')}${getFlights(key).map(fl=>flightChipHTML(fl,key)).join('')}</div>
        <button class="add-event-link" data-key="${key}">+ add event</button>
      </div>
    `;
    block.querySelector('.tag-btn').addEventListener('click', e => cycleStatus(e.target.dataset.key));

    block.querySelector('.add-event-link').addEventListener('click', () => openModal(key, date, true));
    block.querySelectorAll('.event-chip').forEach(chip => chip.addEventListener('click', () => openModal(key, date)));
    block.querySelectorAll('.flight-chip').forEach(chip => chip.addEventListener('click', () => openModal(key, date)));
    el.appendChild(block);
  });
}

// ── MODAL ────────────────────────────────────────────────────────────────────
function openModal(key, date, addEventImmediate = false) {
  modalDk   = key;
  modalDate = date;

  const regular   = getEvents(key).map(ev => ({...ev, _recurring:false, _recurringId:null, _multiday:false}));
  const recForDay = getRecurring().filter(ev => recurringApplies(ev, date))
                                  .map(ev => ({...ev, _recurring:true, _recurringId:ev.id, _multiday:false}));
  const multiForDay = getMultiday().filter(ev => multidayApplies(ev, date))
                                  .map(ev => ({...ev, _multiday:true, _recurring:false, _recurringId:null, startTime:'', endTime:''}));
  modalRecurringOriginalIds = recForDay.map(ev => ev.id);
  modalMultidayOriginalIds = multiForDay.map(ev => ev.id);
  modalEvents = [...multiForDay, ...regular, ...recForDay];

  document.getElementById('modal-title').textContent =
    date.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'});
  document.getElementById('modal-location').value = getDayLocation(key);
  document.getElementById('modal-note').value = DATA[key]||'';

  const status = DATA[key+'-status']||null;
  STATUSES.forEach(s => {
    document.getElementById('mtag-'+s).className = 'modal-tag-btn t-'+s+(status===s?' active':'');
  });

  modalFlights = getFlights(key).map(f => ({...f}));
  renderModalEvents();
  renderModalFlights();
  document.getElementById('modal-overlay').classList.add('open');

  if (addEventImmediate) {
    addModalEvent();
  } else {
    setTimeout(() => document.getElementById('modal-note').focus(), 50);
  }
}

function renderModalEvents() {
  const container = document.getElementById('modal-events-list');
  container.innerHTML = '';

  modalEvents.forEach((ev, idx) => {
    const card = document.createElement('div');
    card.className = 'modal-event-card'
      + (ev._multiday ? ' is-multiday' : '')
      + (ev._recurring ? ' is-recurring' : '');

    const pat = ev.pattern || 'weekly';
    const showDayPicker   = ['weekly','biweekly'].includes(pat);
    const showMonthPicker = pat === 'monthly';
    const activeMDays     = ev.monthDays || (ev.startDate ? [new Date(ev.startDate).getDate()] : [modalDate ? modalDate.getDate() : 1]);
    const dayBtns = DAYS_SHORT.map((d,i) =>
      `<button class="day-check-btn${(ev.days||[]).includes(i)?' active':''}" data-idx="${idx}" data-dow="${i}">${d}</button>`
    ).join('');
    const monthDayBtns =
      Array.from({length:31},(_,i)=>i+1).map(d =>
        `<button class="month-day-btn${activeMDays.includes(d)?' active':''}" data-idx="${idx}" data-md="${d}">${d}</button>`
      ).join('') +
      `<button class="month-day-btn last-day${activeMDays.includes(-1)?' active':''}" data-idx="${idx}" data-md="-1">Last</button>`;

    const mdStartIso = dkToDateInput(ev.startDayKey || modalDk || '');
    const mdEndIso = dkToDateInput(ev.endDayKey || ev.startDayKey || modalDk || '');
    const headerLabel = ev._multiday
      ? '▬ Multi-day Event'
      : (ev._recurring ? '↻ Recurring Event' : `Event ${idx + 1}`);

    card.innerHTML = `
      <div class="event-card-header">
        <div class="event-card-num">${headerLabel}</div>
        <button class="event-delete-btn" data-idx="${idx}" title="Remove">×</button>
      </div>
      <div class="event-fields">
        <div class="event-field full">
          <label>Title</label>
          <input type="text"  data-idx="${idx}" data-field="title"     value="${esc(ev.title)}"    placeholder="Event title" />
        </div>
        <div class="event-field">
          <label>Business Name</label>
          <input type="text"  data-idx="${idx}" data-field="business"  value="${esc(ev.business)}" placeholder="Company / venue" />
        </div>
        <div class="event-field">
          <label>Location</label>
          <input type="text"  data-idx="${idx}" data-field="location"  value="${esc(ev.location)}" placeholder="Address / city" />
        </div>
        <div class="event-field" style="${ev._multiday ? 'display:none' : ''}">
          <label>Start Time</label>
          <input type="time"  data-idx="${idx}" data-field="startTime" value="${ev.startTime||''}" ${ev._multiday ? 'disabled' : ''} />
        </div>
        <div class="event-field" style="${ev._multiday ? 'display:none' : ''}">
          <label>End Time</label>
          <input type="time"  data-idx="${idx}" data-field="endTime"   value="${ev.endTime||''}" ${ev._multiday ? 'disabled' : ''} />
        </div>
        <div class="event-field">
          <label>Contact Name</label>
          <input type="text"  data-idx="${idx}" data-field="contact"   value="${esc(ev.contact)}"  placeholder="Contact person" />
        </div>
        <div class="event-field">
          <label>Contact Email</label>
          <input type="email" data-idx="${idx}" data-field="email"     value="${esc(ev.email)}"    placeholder="email@example.com" />
        </div>

        <div class="recur-toggle-row event-field full">
          <label class="recur-toggle-label">
            <input type="checkbox" class="multiday-checkbox" data-idx="${idx}" ${ev._multiday?'checked':''} />
            Multi-day (all day)
          </label>
        </div>
        <div class="recur-options${ev._multiday?' visible':''}" id="multiday-opts-${idx}">
          <div class="event-field">
            <label>Start Day</label>
            <input type="date" class="multiday-start" data-idx="${idx}" value="${mdStartIso}" />
          </div>
          <div class="event-field">
            <label>End Day</label>
            <input type="date" class="multiday-end" data-idx="${idx}" value="${mdEndIso}" />
          </div>
        </div>

        <div class="recur-toggle-row event-field full" style="${ev._multiday ? 'display:none' : ''}">
          <label class="recur-toggle-label">
            <input type="checkbox" class="recur-checkbox" data-idx="${idx}" ${ev._recurring?'checked':''} ${ev._multiday?'disabled':''} />
            Repeats
          </label>
        </div>

        <div class="recur-options${ev._recurring && !ev._multiday?' visible':''}" id="recur-opts-${idx}">
          <div class="event-field full">
            <label>Pattern</label>
            <select data-idx="${idx}" data-field="pattern" class="recur-pattern-select">
              <option value="daily"    ${pat==='daily'   ?'selected':''}>Every day</option>
              <option value="weekly"   ${pat==='weekly'  ?'selected':''}>Specific days of week</option>
              <option value="biweekly" ${pat==='biweekly'?'selected':''}>Every other week</option>
              <option value="monthly"  ${pat==='monthly' ?'selected':''}>Monthly (same date)</option>
            </select>
          </div>
          <div class="recur-day-picker" id="recur-days-${idx}" style="display:${showDayPicker?'flex':'none'}">
            <label>On These Days</label>
            <div class="day-checkboxes">${dayBtns}</div>
          </div>
          <div class="month-day-picker" id="recur-month-days-${idx}" style="display:${showMonthPicker?'flex':'none'}; flex-direction:column; gap:6px">
            <label>On These Dates Each Month</label>
            <div class="month-day-btns">${monthDayBtns}</div>
          </div>
          <div class="event-field">
            <label>Start Date</label>
            <input type="date" data-idx="${idx}" data-field="startDate" value="${ev.startDate||dateStr(modalDate)}" />
          </div>
          <div class="event-field">
            <label>End Date (optional)</label>
            <input type="date" data-idx="${idx}" data-field="endDate" value="${ev.endDate||''}" />
          </div>
        </div>
      </div>
    `;

    // Delete button — persist immediately so refresh cannot resurrect the event
    card.querySelector('.event-delete-btn').addEventListener('click', e => {
      const i = parseInt(e.currentTarget.dataset.idx, 10);
      if (Number.isNaN(i)) return;
      modalEvents.splice(i, 1);
      renderModalEvents();
      persistModalSchedule();
      clearTimeout(_syncTimer);
      _syncTimer = null;
      pushToRemote();
    });

    // Regular field inputs (skip multiday date inputs — handled separately as day keys)
    card.querySelectorAll('input[data-field], select[data-field]').forEach(input => {
      input.addEventListener('input', e => {
        const i = parseInt(e.target.dataset.idx);
        modalEvents[i][e.target.dataset.field] = e.target.value;
      });
    });

    // Multi-day toggle (mutually exclusive with repeats)
    card.querySelector('.multiday-checkbox').addEventListener('change', e => {
      const i = parseInt(e.target.dataset.idx);
      modalEvents[i]._multiday = e.target.checked;
      if (e.target.checked) {
        modalEvents[i]._recurring = false;
        if (!modalEvents[i].startDayKey) modalEvents[i].startDayKey = modalDk;
        if (!modalEvents[i].endDayKey) modalEvents[i].endDayKey = modalDk;
        normalizeMultidayRange(modalEvents[i]);
        if (!modalEvents[i].id) modalEvents[i].id = Date.now().toString();
      } else {
        delete modalEvents[i].startDayKey;
        delete modalEvents[i].endDayKey;
      }
      renderModalEvents();
    });

    card.querySelectorAll('.multiday-start, .multiday-end').forEach(input => {
      input.addEventListener('change', e => {
        const i = parseInt(e.target.dataset.idx);
        const dkVal = dateInputToDk(e.target.value);
        if (e.target.classList.contains('multiday-start')) modalEvents[i].startDayKey = dkVal;
        else modalEvents[i].endDayKey = dkVal;
        normalizeMultidayRange(modalEvents[i]);
        // Refresh displayed values if swapped
        const startEl = card.querySelector('.multiday-start');
        const endEl = card.querySelector('.multiday-end');
        if (startEl) startEl.value = dkToDateInput(modalEvents[i].startDayKey);
        if (endEl) endEl.value = dkToDateInput(modalEvents[i].endDayKey);
      });
    });

    // Recurring toggle
    const recurCb = card.querySelector('.recur-checkbox');
    if (recurCb) {
      recurCb.addEventListener('change', e => {
        const i = parseInt(e.target.dataset.idx);
        modalEvents[i]._recurring = e.target.checked;
        if (e.target.checked) {
          modalEvents[i]._multiday = false;
          delete modalEvents[i].startDayKey;
          delete modalEvents[i].endDayKey;
          if (!modalEvents[i].pattern)   modalEvents[i].pattern   = 'weekly';
          if (!modalEvents[i].days)      modalEvents[i].days      = [modalDate.getDay()];
          if (!modalEvents[i].startDate) modalEvents[i].startDate = dateStr(modalDate);
          if (!modalEvents[i].id)        modalEvents[i].id        = Date.now().toString();
        }
        renderModalEvents();
      });
    }

    // Pattern select
    const patSelect = card.querySelector('.recur-pattern-select');
    if (patSelect) {
      patSelect.addEventListener('change', e => {
        const i = parseInt(e.target.dataset.idx);
        modalEvents[i].pattern = e.target.value;
        const dayPicker      = document.getElementById(`recur-days-${i}`);
        const monthDayPicker = document.getElementById(`recur-month-days-${i}`);
        if (dayPicker)      dayPicker.style.display      = ['weekly','biweekly'].includes(e.target.value) ? 'flex' : 'none';
        if (monthDayPicker) monthDayPicker.style.display = e.target.value === 'monthly' ? 'flex' : 'none';
        if (e.target.value === 'monthly' && (!modalEvents[i].monthDays || !modalEvents[i].monthDays.length)) {
          modalEvents[i].monthDays = [modalDate ? modalDate.getDate() : 1];
          if (monthDayPicker) {
            monthDayPicker.querySelectorAll('.month-day-btn').forEach(b => {
              b.classList.toggle('active', modalEvents[i].monthDays.includes(parseInt(b.dataset.md)));
            });
          }
        }
      });
    }

    // Day-of-week buttons
    card.querySelectorAll('.day-check-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        const i = parseInt(e.target.dataset.idx);
        const dow = parseInt(e.target.dataset.dow);
        const days = modalEvents[i].days = [...(modalEvents[i].days||[])];
        const pos = days.indexOf(dow);
        if (pos >= 0) days.splice(pos, 1); else days.push(dow);
        days.sort((a,b)=>a-b);
        e.target.classList.toggle('active', days.includes(dow));
      });
    });

    // Month-day buttons
    card.querySelectorAll('.month-day-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        const i  = parseInt(e.target.dataset.idx);
        const md = parseInt(e.target.dataset.md);
        const mdays = modalEvents[i].monthDays = [...(modalEvents[i].monthDays||[])];
        const pos = mdays.indexOf(md);
        if (pos >= 0) mdays.splice(pos, 1); else mdays.push(md);
        mdays.sort((a,b)=>a-b);
        e.target.classList.toggle('active', mdays.includes(md));
      });
    });

    container.appendChild(card);
  });
}

function addModalEvent() {
  modalEvents.push({
    id: Date.now().toString(), title:'', business:'', location:'',
    startTime:'', endTime:'', contact:'', email:'',
    _recurring: false, _recurringId: null, _multiday: false,
    pattern:'weekly', days:[modalDate ? modalDate.getDay() : 1],
    startDate: modalDate ? dateStr(modalDate) : '', endDate:''
  });

    const cards = document.querySelectorAll('.modal-event-card');

    const ti = last.querySelector('input[data-field="title"]');

    card.querySelector('.mfc-delete').addEventListener('click', e => {
      const i = parseInt(e.currentTarget.dataset.flidx, 10);
      if (Number.isNaN(i)) return;
      modalFlights.splice(i, 1);
      renderModalFlights();
      persistModalSchedule();
      clearTimeout(_syncTimer);
      _syncTimer = null;
      pushToRemote();
    });

    card.querySelectorAll('.mfc-input[data-field]').forEach(inp => {
      inp.addEventListener('input', e => {
        const i = parseInt(e.target.dataset.flidx);

      });

    card.querySelector('.mfc-lookup-btn').addEventListener('click', e =>
      lookupFlight(parseInt(e.target.dataset.flidx))
    );

    container.appendChild(card);

function addModalFlight() {

async function lookupFlight(idx) {
  const fl = modalFlights[idx];
  if (!fl) return;
  const num  = (fl.flightNum || '').trim();
  const date = fl.lookupDate || dateStr(modalDate);
  if (!num) {
    const s = document.getElementById(`mfc-status-${idx}`);
    if (s) { s.textContent = 'Enter a flight number first.'; s.className = 'mfc-status error'; }
    return;
  }

  const statusEl = document.getElementById(`mfc-status-${idx}`);
  const btn      = document.querySelector(`.mfc-lookup-btn[data-flidx="${idx}"]`);
  if (statusEl) { statusEl.textContent = 'Looking up…'; statusEl.className = 'mfc-status'; }
  if (btn)      { btn.disabled = true; }

  try {
    const r = await fetch(`/api/flight?num=${encodeURIComponent(num)}&date=${date}`);
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    if (!data.flights?.length) throw new Error('No flights found for that number and date.');

    const f = data.flights[0];
    Object.assign(modalFlights[idx], {
      airline:       f.airline       || fl.airline,
      originCode:    f.originCode    || fl.originCode,
      originAirport: f.originAirport || fl.originAirport,
      destCode:      f.destCode      || fl.destCode,
      destAirport:   f.destAirport   || fl.destAirport,
      departureTime: f.departureTime || fl.departureTime,
      arrivalTime:   f.arrivalTime   || fl.arrivalTime,
    });

    renderModalFlights();
    const newS = document.getElementById(`mfc-status-${idx}`);
    if (newS) { newS.textContent = '✓ Auto-filled from live flight data'; newS.className = 'mfc-status ok'; }
  } catch (e) {
    const newS = document.getElementById(`mfc-status-${idx}`);
    if (newS) { newS.textContent = e.message; newS.className = 'mfc-status error'; }
    if (btn) btn.disabled = false;
  }
}

function persistModalSchedule() {
  if (!modalDk) return;
  const regularToSave   = modalEvents.filter(ev => !ev._recurring && !ev._multiday && (ev.title||ev.business||ev.startTime||ev.endTime));
  const recurringToSave = modalEvents.filter(ev =>  ev._recurring && !ev._multiday && (ev.title||ev.business||ev.startTime||ev.endTime));
  const multidayToSave  = modalEvents.filter(ev =>  ev._multiday && (ev.title||ev.business) && ev.startDayKey && ev.endDayKey);

  DATA[modalDk + '-events'] = JSON.stringify(regularToSave.map(ev => {
    const {_recurring, _recurringId, _multiday, startDayKey, endDayKey, ...rest} = ev;
    return rest;
  }));
  markDirty(modalDk + '-events');

  const keptIds = new Set(recurringToSave.map(ev => ev._recurringId||ev.id).filter(Boolean));
  let allRecurring = getRecurring()
    .filter(r => !modalRecurringOriginalIds.includes(r.id) || keptIds.has(r.id));

  recurringToSave.forEach(ev => {
    const {_recurring, _recurringId, _multiday, startDayKey, endDayKey, ...toSave} = ev;
    if (!toSave.id) toSave.id = Date.now().toString();
    const existIdx = allRecurring.findIndex(r => r.id === (_recurringId||toSave.id));
    if (existIdx >= 0) allRecurring[existIdx] = toSave;
    else allRecurring.push(toSave);
  });
  DATA['__recurring__'] = JSON.stringify(allRecurring);
  markDirty('__recurring__');

  const keptMultiIds = new Set(multidayToSave.map(ev => ev.id).filter(Boolean));
  let allMultiday = getMultiday()
    .filter(m => !modalMultidayOriginalIds.includes(m.id) || keptMultiIds.has(m.id));

  multidayToSave.forEach(ev => {
    normalizeMultidayRange(ev);
    const {_recurring, _recurringId, _multiday, pattern, days, monthDays, startDate, endDate, startTime, endTime, ...toSave} = ev;
    if (!toSave.id) toSave.id = Date.now().toString();
    toSave.startDayKey = ev.startDayKey;
    toSave.endDayKey = ev.endDayKey;
    const existIdx = allMultiday.findIndex(m => m.id === toSave.id);
    if (existIdx >= 0) {
      // Preserve google sync fields if the modal copy lacked them
      const prev = allMultiday[existIdx];
      allMultiday[existIdx] = {
        ...toSave,
        googleEventId: toSave.googleEventId || prev.googleEventId,
        googleSyncedAt: toSave.googleSyncedAt || prev.googleSyncedAt,
      };
    } else {
      allMultiday.push(toSave);
    }
  });
  DATA[MULTIDAY_SYNC_KEY] = JSON.stringify(allMultiday);
  markDirty(MULTIDAY_SYNC_KEY);

  const flightsToSave = modalFlights.filter(f => f.flightNum || f.airline || f.originCode || f.destCode);
  const normalized = flightsToSave.map((f, i) => {
    if (!f) return f;
    if (f.id) return f;
    return { ...f, id: 'fl-' + Date.now().toString(36) + '-' + i + '-' + Math.random().toString(36).slice(2, 6) };
  });
  DATA[modalDk + '-flights'] = JSON.stringify(normalized);
  markDirty(modalDk + '-flights');

  saveLocal(DATA);
  schedulePush(0);
}

function saveModal() {
  if (modalDk) {
    setDayLocation(modalDk, document.getElementById('modal-location').value);
    DATA[modalDk] = document.getElementById('modal-note').value;

  modalDk = null; modalDate = null; modalEvents = []; modalFlights = [];
  modalRecurringOriginalIds = []; modalMultidayOriginalIds = [];
