function navPrev() {
  if (currentView === 'week-grid' || currentView === 'week-list') {
    curWeekStart = new Date(curWeekStart); curWeekStart.setDate(curWeekStart.getDate()-7);
  } else if (currentView === 'day') {
    curDay = new Date(curDay); curDay.setDate(curDay.getDate()-1);
  } else {
    cur.month--; if (cur.month < 0) { cur.month = 11; cur.year--; }
  }
  render();
}

function navNext() {
  if (currentView === 'week-grid' || currentView === 'week-list') {
    curWeekStart = new Date(curWeekStart); curWeekStart.setDate(curWeekStart.getDate()+7);
  } else if (currentView === 'day') {
    curDay = new Date(curDay); curDay.setDate(curDay.getDate()+1);
  } else {
    cur.month++; if (cur.month > 11) { cur.month = 0; cur.year++; }
  }
  render();
}

function render() {
  flushOpenTodoEdits();
  migrateWeekLocationsToDays();
  if (currentView === 'week-grid' || currentView === 'week-list') {
    const dates = getWeekDates(curWeekStart);
    const s = dates[0]; const e = dates[6];
    const sm = s.getMonth() === e.getMonth();
    document.getElementById('month-title').textContent = sm
      ? `${MONTHS_SHORT[s.getMonth()]} ${s.getDate()}–${e.getDate()}, ${s.getFullYear()}`
      : `${MONTHS_SHORT[s.getMonth()]} ${s.getDate()} – ${MONTHS_SHORT[e.getMonth()]} ${e.getDate()}, ${e.getFullYear()}`;
  } else if (currentView === 'day') {
    document.getElementById('month-title').textContent =
      curDay.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric', year:'numeric'});
  } else if (currentView !== 'dashboard' && currentView !== 'todo') {
    document.getElementById('month-title').textContent = `${MONTHS[cur.month]} ${cur.year}`;
  }

  if      (currentView === 'dashboard') renderDashboard();
  else if (currentView === 'grid')      renderGrid();
  else if (currentView === 'list')      renderList();
  else if (currentView === 'week-grid') renderWeekGrid();
  else if (currentView === 'week-list') renderWeekList();
  else if (currentView === 'day')       renderDay();
  else if (currentView === 'todo')      renderTodo();
}

let _fpProjectsMigrated = false;

function ensureProjectsMigrated() {
  if (_fpProjectsMigrated) return;
  _fpProjectsMigrated = true;
  try {
    let projects = [];
    try { projects = JSON.parse(DATA[PROJECTS_KEY] || '[]'); } catch (_) { projects = []; }
    if (!Array.isArray(projects)) projects = [];
    let addedGeneral = false;
    if (!projects.some(p => p && p.id === GENERAL_PID)) {
      addedGeneral = true;
      projects.unshift({
        id: GENERAL_PID, name: 'General', maintenanceHint: '',
        lastTouchAt: Date.now(), staleAfterDays: 7, sort: -1,
      });
    }
    projects.forEach((p, i) => { if (p && (p.sort === undefined || p.sort === null)) p.sort = i; });
    let plateFix = false;
    projects.forEach((p, idx) => {
      if (!p.plateColor) {
        p.plateColor = PLATE_HEX_DEFAULT[idx % PLATE_HEX_DEFAULT.length];
        plateFix = true;
      }
    });
    let dashHiddenFix = false;
    projects.forEach(p => {
      if (p && (p.dashboardHidden === undefined || p.dashboardHidden === null)) {
        p.dashboardHidden = false;
        dashHiddenFix = true;
      }
    });
    DATA[PROJECTS_KEY] = JSON.stringify(projects);

    let todos = [];
    try { todos = JSON.parse(DATA[TODOS_KEY] || '[]'); } catch (_) { todos = []; }
    let changedTodos = false;
    for (const t of todos) {
      if (t && !t.projectId) { t.projectId = GENERAL_PID; changedTodos = true; }
    }
    if (changedTodos) DATA[TODOS_KEY] = JSON.stringify(todos);
    if (addedGeneral || changedTodos || plateFix || dashHiddenFix) {
      if (addedGeneral) markDirty(PROJECTS_KEY);
      if (changedTodos) markDirty(TODOS_KEY);
      saveData(DATA);
    }
    else saveLocal(DATA);
  } catch (e) { console.warn('[FP] project migrate', e); }
}

function getProjects() {
  ensureProjectsMigrated();
  try {
    return JSON.parse(DATA[PROJECTS_KEY] || '[]').sort((a, b) => (a.sort | 0) - (b.sort | 0));
  } catch (_) { return []; }
}

function saveProjects(arr) {
  DATA[PROJECTS_KEY] = JSON.stringify(arr);
  markDirty(PROJECTS_KEY);
  saveData(DATA);
}

function getTodos() {
  ensureProjectsMigrated();
  try { return JSON.parse(DATA[TODOS_KEY] || '[]'); } catch (_) { return []; }
}

function saveTodos(arr) {
  DATA[TODOS_KEY] = JSON.stringify(arr);
  markDirty(TODOS_KEY);
  saveLocal(DATA);
  schedulePush(300);
}
function newTodoId() { return 't-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7); }

function touchProject(pid) {
  const projects = getProjects();
  const p = projects.find(x => x.id === pid);
  if (!p) return;
  p.lastTouchAt = Date.now();
  saveProjects(projects);
}

function projectWorkedToday(pid) {
  touchProject(pid);
  refreshTodoViews();
}

function openTodoForProject(pid) {
  selectedTodoProjectId = pid;
  try { localStorage.setItem('fp-todo-project', pid); } catch (_) {}
  setView('todo');
}

function isTodoAllProjectsView() {
  return selectedTodoProjectId === ALL_PROJECTS_PID;
}

function onTodoProjectChange(pid) {
  selectedTodoProjectId = pid;
  try { localStorage.setItem('fp-todo-project', pid); } catch (_) {}
  renderTodo();
}

function addProjectFromPrompt() {
  const name = prompt('New project name:');
  if (!name || !String(name).trim()) return;
  const projects = getProjects();
  const id = 'p-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6);
  projects.push({
    id,
    name: String(name).trim(),
    maintenanceHint: '',
    lastTouchAt: Date.now(),
    staleAfterDays: 7,
    sort: projects.length,
    plateColor: PLATE_HEX_DEFAULT[projects.length % PLATE_HEX_DEFAULT.length],
    dashboardHidden: false,
  });
  saveProjects(projects);
  selectedTodoProjectId = id;
  try { localStorage.setItem('fp-todo-project', id); } catch (_) {}
  refreshTodoViews();
}

function promptProjectSettings(pid) {
  const projects = getProjects();
  const p = projects.find(x => x.id === pid);
  if (!p) return;
  const nm = prompt('Project name:', p.name || '');
  if (nm === null) return;
  const nmTrim = String(nm).trim();
  if (nmTrim) p.name = nmTrim;
  const hint = prompt('Maintenance / upkeep reminder (one line, optional):', p.maintenanceHint || '');
  if (hint === null) return;
  const dr = prompt(
    'Show “Needs attention” if you have not logged activity for this many days:',
    String(p.staleAfterDays != null ? p.staleAfterDays : 7)
  );
  if (dr === null) return;
  const n = parseInt(dr, 10);
  p.maintenanceHint = String(hint).trim();
  p.staleAfterDays = (!isNaN(n) && n >= 1 && n <= 365) ? n : 7;
  const col = prompt(
    'Plate accent color (#RRGGBB), optional — blank keeps the current swatch:',
    p.plateColor || ''
  );
  if (col !== null && col.trim() !== '' && /^#[0-9A-Fa-f]{6}$/.test(col.trim())) {
    p.plateColor = col.trim();
  }
  saveProjects(projects);
  refreshTodoViews();
}

/** Remove a project plate; todos move to General. Cannot remove General. */
function deleteProject(pid) {
  if (!pid || pid === GENERAL_PID) return;
  const ok = confirm(
    'Remove this project? All tasks in it move to General.'
  );
  if (!ok) return;
  const projects = getProjects().filter(p => p.id !== pid);
  const todos = getTodos().map(t =>
    (t.projectId === pid) ? { ...t, projectId: GENERAL_PID, updatedAt: Date.now() } : t
  );
  saveProjects(projects);
  saveTodos(todos);
  if (selectedTodoProjectId === pid) {
    selectedTodoProjectId = GENERAL_PID;
    try { localStorage.setItem('fp-todo-project', GENERAL_PID); } catch (_) {}
  }
  refreshTodoViews();
}

function getDashShowHidden() {
  migrateDashPrefsIntoData();
  try { return DATA[DATA_KEY_DASH_SHOW_HIDDEN] === '1'; } catch (_) { return false; }
}

function onDashShowHiddenChange(el) {
  try {
    if (el.checked) {
      DATA[DATA_KEY_DASH_SHOW_HIDDEN] = '1';
      markDirty(DATA_KEY_DASH_SHOW_HIDDEN);
    } else {
      delete DATA[DATA_KEY_DASH_SHOW_HIDDEN];
      markDeleted(DATA_KEY_DASH_SHOW_HIDDEN);
    }
  } catch (_) {}
  saveData(DATA);
  refreshTodoViews();
}

function getDashboardTop3ProjectId() {
  migrateDashPrefsIntoData();
  try {
    const v = DATA[DATA_KEY_DASH_TOP3];
    if (typeof v === 'string' && v.length && getProjects().some(p => p.id === v)) return v;
  } catch (_) {}
  return GENERAL_PID;
}

function onDashboardTop3ProjectChange(val) {
  DATA[DATA_KEY_DASH_TOP3] = val;
  markDirty(DATA_KEY_DASH_TOP3);
  saveData(DATA);
  refreshTodoViews();
}

function getProjectsForDashboardGrid() {
  const showHidden = getDashShowHidden();
  return getProjects().filter(p => showHidden || !p.dashboardHidden);
}

function togglePlateDashboardHidden(pid, e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  if (!pid || pid === GENERAL_PID) return;
  const projects = getProjects();
  const p = projects.find(x => x.id === pid);
  if (!p) return;
  p.dashboardHidden = !p.dashboardHidden;
  saveProjects(projects);
  refreshTodoViews();
}

function importanceTier(t) {
  const k = ((t && t.importance) || '').toLowerCase();
  if (k === 'a') return 0;
  if (k === 'b') return 1;
  if (k === 'c') return 2;
  return 3;
}

/** Active todos for a project sorted A→B→C, then unrated (—), preserving list order among ties (global traversal order within project scope). */
function sortActiveTodosForPlate(pid, allTodos) {
  const full = allTodos || getTodos();
  const order = [];
  full.forEach(t => {
    if (t.projectId === pid && !t.done) order.push(t);
  });
  return order.slice().sort((a, b) => todoDisplaySort(a, b, order));
}

/** All active todos across projects, same importance sort within global list order. */
function sortAllActiveTodos(allTodos) {
  const full = allTodos || getTodos();
  const order = [];
  full.forEach(t => {
    if (!t.done) order.push(t);
  });
  return order.slice().sort((a, b) => todoDisplaySort(a, b, order));
}

function projectPickHtml(todoId, projectId) {
  const projects = getProjects();
  const cur = projectId || GENERAL_PID;
  const opts = projects.map(p =>
    `<option value="${esc(p.id)}"${p.id === cur ? ' selected' : ''}>${escHtml(p.name)}</option>`
  ).join('');
  return `<select class="todo-project-cell-select" aria-label="Project bucket" title="Move to project"
    onchange="setTodoProject(${JSON.stringify(todoId)}, this.value)">${opts}</select>`;
}

function setTodoProject(id, newPid) {
  if (!newPid) return;
  const todos = getTodos();
  const t = todos.find(x => x.id === id);
  if (!t || t.projectId === newPid) return;
  const oldPid = t.projectId;
  t.projectId = newPid;
  touchTodo(t);
  saveTodos(todos);
  if (oldPid) touchProject(oldPid);
  touchProject(newPid);
  refreshTodoViews();
}

function importancePickHtml(id, imp) {
  const v = ((imp || '') + '').toLowerCase();
  const sel = x => v === x ? ' selected' : '';
  return `<select class="todo-import-select" aria-label="Importance" title="Priority A/B/C"
    onchange="setTodoImportance(${JSON.stringify(id)}, this.value)">
    <option value=""${sel('')}>–</option>
    <option value="a"${sel('a')}>A</option>
    <option value="b"${sel('b')}>B</option>
    <option value="c"${sel('c')}>C</option>
  </select>`;
}

function importanceDoneLabel(todo) {
  const v = ((todo && todo.importance) || '').toUpperCase();
  return `<span class="todo-import-static">${escHtml(v || '–')}</span>`;
}

function setTodoImportance(id, val) {
  const raw = ((val || '') + '').toLowerCase().trim();
  const tier = raw === '' || raw === 'a' || raw === 'b' || raw === 'c' ? raw : '';
  const todos = getTodos();
  const t = todos.find(x => x.id === id);
  if (!t) return;
  if (tier === '') t.importance = null;
  else t.importance = tier;
  touchTodo(t);
  saveTodos(todos);
  if (t.projectId) touchProject(t.projectId);
  refreshTodoViews();
}

function openPlateModal(pid) {
  plateModalPid = pid;
  const p = getProjects().find(x => x.id === pid);
  if (!p) return;
  const tt = document.getElementById('plate-modal-title');
  const bd = document.getElementById('plate-modal-body');
  if (!tt || !bd) return;
  tt.textContent = p.name;
  const all = getTodos();
  const active = sortActiveTodosForPlate(pid, all);
  const doneCount = all.filter(t => t.projectId === pid && t.done).length;
  let html = '';
  if (!active.length && !doneCount) {
    html = '<p style="color:var(--text-muted);font-size:14px;line-height:1.45;">No tasks in this project yet.</p>';
  } else {
    if (active.length) {
      html += '<div class="modal-section-label" style="margin-top:0">Active</div><ul>';
      active.forEach(t => {
        const lab = (t.importance || '').toUpperCase() || '—';
        html += `<li><div class="plate-modal-li-meta">Priority ${escHtml(String(lab))}</div>${escHtml(t.text)}</li>`;
      });
      html += '</ul>';
    }
    if (doneCount) {
      html += `<div class="modal-section-label"${active.length ? '' : ' style="margin-top:0"'}">Completed</div>`;
      html += `<p style="font-size:12px;color:var(--text-muted); margin: 0;">${doneCount} done — open Todo view to manage.</p>`;
    }
  }
  bd.innerHTML = html;
  document.getElementById('plate-modal-overlay').classList.add('open');
}

function closePlateModal() {
  plateModalPid = null;
  document.getElementById('plate-modal-overlay')?.classList.remove('open');
}

function openTodoFromPlateModal() {
  const id = plateModalPid;
  if (!id) return;
  closePlateModal();
  openTodoForProject(id);
}

function getAddTodoProjectId() {
  if (currentView === 'dashboard') return getDashboardTop3ProjectId();
  if (isTodoAllProjectsView()) {
    const sel = document.getElementById('todo-add-project-select');
    if (sel && sel.value) return sel.value;
    return GENERAL_PID;
  }
  return selectedTodoProjectId || GENERAL_PID;
}

function daysSinceTouchMs(ms) {
  if (ms == null) return Infinity;
  return Math.floor((Date.now() - ms) / 86400000);
}

function sanitizePlateHex(v) {
  if (v == null || typeof v !== 'string') return '#378ADD';
  const s = v.trim();
  return /^#[0-9A-Fa-f]{6}$/.test(s) ? s : '#378ADD';
}

function plateGradientUid(pid) {
  let h = 0;
  for (let i = 0; i < pid.length; i++) h = (h + pid.charCodeAt(i) * (i + 241)) >>> 0;
  return 'pgrad' + h.toString(36);
}

function plateSvgMarkup(gradId, strokeHex) {
  const eh = sanitizePlateHex(strokeHex);
  return `<svg class="proj-plate-svg" viewBox="0 0 112 54" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="${gradId}" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#ffffff;stop-opacity:.75"/>
        <stop offset="42%" style="stop-color:${eh};stop-opacity:.28"/>
        <stop offset="100%" style="stop-color:${eh};stop-opacity:.95"/>
      </linearGradient>
    </defs>
    <ellipse cx="56" cy="29" rx="50" ry="21" fill="url(#${gradId})" stroke="${eh}" stroke-width="1.75"/>
    <ellipse cx="56" cy="27" rx="46" ry="8" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="0.55" opacity=".75"/>
  </svg>`;
}

function setProjectPlateColor(pid, hex) {
  const h = sanitizePlateHex(hex);
  const projects = getProjects();
  const p = projects.find(x => x.id === pid);
  if (!p) return;
  p.plateColor = h;
  saveProjects(projects);
  refreshTodoViews();
}

/** Progress + plate cards on Home */
function renderProjectCardsHtml() {
  const projects = getProjectsForDashboardGrid();
  const allTodos = getTodos();
  return projects.map(p => {
    const scoped = allTodos.filter(t => t.projectId === p.id);
    const doneC = scoped.filter(t => t.done).length;
    const total = scoped.length;
    const pct = total ? Math.round((doneC / total) * 100) : 0;
    const thresh = (p.staleAfterDays != null && p.staleAfterDays > 0) ? p.staleAfterDays : 7;
    const days = daysSinceTouchMs(p.lastTouchAt);
    const stale = p.lastTouchAt == null || days >= thresh || days === Infinity;
    let lastLabel;
    if (p.lastTouchAt == null) lastLabel = 'never logged';
    else if (days === 0) lastLabel = 'today';
    else if (days === 1) lastLabel = 'yesterday';
    else lastLabel = `${days} days ago`;

    const hint = (p.maintenanceHint || '').trim();
    const attrId = esc(p.id);
    const hx = sanitizePlateHex(p.plateColor);
    const gid = plateGradientUid(p.id);

    const swatches = PLATE_SWATCH_PALETTE.map(hex =>
      `<button type="button" class="plate-swatch" data-hex="${hex}" style="background:${hex}"
        title="${hex}" aria-label="Set plate ${hex}"></button>`
    ).join('');

    const safeHint = hint ? `<div class="proj-hint">${escHtml(hint)}</div>` : '';

    const dashHiddenBadge = p.dashboardHidden ? `<span class="proj-badge proj-badge-muted">Hidden on Home</span>` : '';
    const hideBtnLabel = p.dashboardHidden ? 'Show on Home' : 'Hide from Home';

    return `
      <div class="proj-card ${stale ? 'is-stale' : ''}${p.dashboardHidden ? ' is-dash-hidden' : ''}" data-project-id="${attrId}" style="--plate:${hx}">
      <div class="proj-card-inner">
        <div class="proj-plate-row">
          <div class="proj-plate-svg-wrap" style="--plate:${hx}">
            ${plateSvgMarkup(gid, hx)}
            <span class="proj-plate-pct">${pct}%</span>
          </div>
          <div class="proj-plate-head">
            <div class="proj-card-top">
              <span class="proj-name">${escHtml(p.name)}</span>
              ${dashHiddenBadge}
              ${stale ? '<span class="proj-badge">Needs attention</span>' : ''}
            </div>
          </div>
        </div>
        <div class="proj-bar-wrap" title="${doneC} of ${total} tasks done"><div class="proj-bar" style="width:${pct}%"></div></div>
        <div class="proj-meta">${total ? `${doneC}/${total} done` : 'No tasks yet'} · Activity: ${lastLabel}</div>
        ${safeHint}
        <div class="proj-plate-swatches"><span>Color</span>${swatches}</div>
        <div class="proj-actions">
          <button type="button" class="proj-btn proj-plate-peek" title="View tasks on this plate">Peek</button>
          <button type="button" class="proj-btn primary proj-plate-work">Worked today</button>
          <button type="button" class="proj-btn proj-plate-open">Open todos</button>
          <button type="button" class="proj-btn proj-plate-edit" title="Name, maintenance, color">⚙</button>
          ${p.id !== GENERAL_PID ? `<button type="button" class="proj-btn proj-plate-hide" title="${p.dashboardHidden ? 'Show this plate on Home again' : 'Hide from Home (does not delete tasks)'}">${hideBtnLabel}</button>` : ''}
          ${p.id !== GENERAL_PID ? `<button type="button" class="proj-btn danger proj-plate-delete" title="Remove project (tasks → General)">Remove</button>` : ''}
        </div>
      </div>
      </div>
    `;
  }).join('');
}

function wireDashboardProjectCards(host) {
  host.querySelectorAll('.proj-card').forEach(card => {
    const pid = card.dataset.projectId;
    if (!pid) return;
    card.querySelector('.proj-plate-work')?.addEventListener('click', () => projectWorkedToday(pid));
    card.querySelector('.proj-plate-open')?.addEventListener('click', () => openTodoForProject(pid));
    card.querySelector('.proj-plate-peek')?.addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      openPlateModal(pid);
    });
    card.querySelector('.proj-plate-edit')?.addEventListener('click', () => promptProjectSettings(pid));
    card.querySelector('.proj-plate-hide')?.addEventListener('click', e => togglePlateDashboardHidden(pid, e));
    card.querySelector('.proj-plate-delete')?.addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      deleteProject(pid);
    });
    card.querySelectorAll('.plate-swatch').forEach(btn => {
      btn.addEventListener('click', e => {
        e.preventDefault();
        e.stopPropagation();
        setProjectPlateColor(pid, btn.dataset.hex);
      });
    });

    card.addEventListener('click', e => {
      if (e.target.closest('button')) return;
      openPlateModal(pid);
    });
  });
}

function addTodo() {
  const input = document.getElementById('todo-add-input') || document.getElementById('dashboard-todo-add-input');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  const todos = getTodos();
  const pid = getAddTodoProjectId();
  const activeCount = todos.filter(t => !t.done).length;
  const item = { id: newTodoId(), text, done: false, createdAt: Date.now(), updatedAt: Date.now(), projectId: pid };
  todos.splice(activeCount, 0, item);
  saveTodos(todos);
  touchProject(pid);
  input.value = '';
  refreshTodoViews();
  requestAnimationFrame(() => {
    const el = document.getElementById('todo-add-input') || document.getElementById('dashboard-todo-add-input');
    if (el) el.focus();
  });
}

function updateTodoText(id, text) {
  const todos = getTodos();
  const t = todos.find(x => x.id === id);
  if (!t) return;
  if (t.text === text) return;
  t.text = text;
  touchTodo(t);
  saveTodos(todos);
}

function queueTodoTextSave(id, text) {
  _todoTextSavePending = { id, text };
  clearTimeout(_todoTextSaveTimer);
  _todoTextSaveTimer = setTimeout(() => {
    const p = _todoTextSavePending;
    _todoTextSavePending = null;
    if (p) updateTodoText(p.id, p.text);
  }, 400);
}

function autoSizeTodoText(el) {
  if (!el) return;
  el.style.height = 'auto';
  el.style.height = `${el.scrollHeight}px`;
}

function initTodoTextareas(root) {
  (root || document).querySelectorAll('textarea.todo-text').forEach(autoSizeTodoText);
}

function toggleTodoDone(id) {
  const todos = getTodos();
  const idx = todos.findIndex(x => x.id === id);
  if (idx === -1) return;
  const pid = todos[idx].projectId;
  todos[idx].done = !todos[idx].done;
  touchTodo(todos[idx]);
  if (todos[idx].done) {
    const [done] = todos.splice(idx, 1);
    todos.push(done);
  } else {
    const [item] = todos.splice(idx, 1);
    const activeCount = todos.filter(t => !t.done).length;
    todos.splice(activeCount, 0, item);
  }
  saveTodos(todos);
  if (pid) touchProject(pid);
  refreshTodoViews();
}

function deleteTodo(id) {
  const todos = getTodos();
  const t = todos.find(x => x.id === id);
  const pid = t && t.projectId;
  const next = todos.filter(x => x.id !== id);
  saveTodos(next);
  if (pid) touchProject(pid);
  refreshTodoViews();
  clearTimeout(_syncTimer);
  _syncTimer = null;
  pushToRemote();
}

function moveTodo(id, dir) {
  const todos = getTodos();
  const idx = todos.findIndex(x => x.id === id);
  if (idx === -1) return;
  const pid = todos[idx].projectId;
  const doneSame = todos[idx].done;

  const blockIdx = [];
  for (let i = 0; i < todos.length; i++) {
    if (todos[i].projectId === pid && todos[i].done === doneSame) blockIdx.push(i);
  }
  const sub = blockIdx.indexOf(idx);
  const targetSub = sub + dir;
  if (targetSub < 0 || targetSub >= blockIdx.length) return;
  const j = blockIdx[targetSub];
  const tmp = todos[idx];
  todos[idx] = todos[j];
  todos[j] = tmp;
  saveTodos(todos);
  if (pid) touchProject(pid);
  refreshTodoViews();
}

function promoteTodoToTop(id) {
  const todos = getTodos();
  const idx = todos.findIndex(x => x.id === id);
  if (idx === -1 || todos[idx].done) return;
  const pid = todos[idx].projectId;
  const [item] = todos.splice(idx, 1);
  let insertAt = todos.findIndex(t => !t.done && t.projectId === pid);
  if (insertAt === -1) {
    const activeCount = todos.filter(t => !t.done).length;
    todos.splice(activeCount, 0, item);
  } else {
    todos.splice(insertAt, 0, item);
  }
  saveTodos(todos);
  if (pid) touchProject(pid);
  refreshTodoViews();
}

function clearCompletedTodos() {
  const todos = isTodoAllProjectsView()
    ? getTodos().filter(x => !x.done)
    : getTodos().filter(x => !(x.done && x.projectId === (selectedTodoProjectId || GENERAL_PID)));
  saveTodos(todos);
  if (!isTodoAllProjectsView()) touchProject(selectedTodoProjectId || GENERAL_PID);
  refreshTodoViews();
}

function todoTextareaHtml(id, text) {
  const safeId = escHtml(id);
  return `<textarea class="todo-text" rows="1" data-todo-id="${safeId}"
    oninput="autoSizeTodoText(this); queueTodoTextSave('${safeId}', this.value)"
    onblur="updateTodoText('${safeId}', this.value)"
    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();this.blur();}">${escHtml(text)}</textarea>`;
}

function renderTop3Card(rank, todo) {
  const placeholder = !todo;
  const rankNames = { 1: 'rank-1', 2: 'rank-2', 3: 'rank-3' };
  const classes = ['top3-card', rankNames[rank]];
  if (placeholder) classes.push('placeholder');
  if (todo && todo.done) classes.push('is-done');
  const safeId = todo ? escHtml(todo.id) : '';
  const impHtml = placeholder ? '' : importancePickHtml(todo.id, todo.importance);
  return `
    <div class="${classes.join(' ')}">
      <div class="top3-rank">${rank}</div>
      <div class="top3-import">${impHtml}</div>
      <div class="todo-body">
        ${placeholder
          ? `<div class="todo-text" style="color:var(--text-faint); font-style:italic; font-weight:300;">Add a task below…</div>`
          : `<button class="todo-check ${todo.done ? 'is-done' : ''}" title="Mark ${todo.done ? 'not done' : 'done'}"
                      onclick="toggleTodoDone('${safeId}')">${todo.done ? '✓' : ''}</button>
             ${todoTextareaHtml(todo.id, todo.text)}`}
      </div>
      <div class="todo-actions">
        ${placeholder ? '' : `
          <button class="todo-btn" title="Move up"   onclick="moveTodo('${safeId}', -1)" ${rank===1?'disabled':''}>▲</button>
          <button class="todo-btn" title="Move down" onclick="moveTodo('${safeId}',  1)">▼</button>
          <button class="todo-btn danger" title="Delete" onclick="deleteTodo('${safeId}')">✕</button>
        `}
      </div>
    </div>
  `;
}

function renderTodoRow(todo, displayRank, totalActive, showProjectPick) {
  const safeId = escHtml(todo.id);
  const isDone = todo.done;
  const overdue = !isDone && isTodoOverdue(todo);
  const impHtml = isDone ? importanceDoneLabel(todo) : importancePickHtml(todo.id, todo.importance);
  const projCell = showProjectPick
    ? `<div class="todo-project-cell">${projectPickHtml(todo.id, todo.projectId)}</div>`
    : '';
  const schedCls = ['todo-row', 'has-sched-cols', isDone ? 'is-done' : '', overdue ? 'is-overdue' : '', showProjectPick ? 'has-project-pick' : ''].filter(Boolean).join(' ');
  const dueCell = isDone ? '' : `<div class="todo-due-cell">${todoDueHtml(todo.id, todo.dueBy)}</div>`;
  const blockCell = isDone ? '' : `<div class="todo-block-cell">${todoBlockHtml(todo.id, todo)}</div>`;
  return `
    <div class="${schedCls}">
      <div class="todo-rank-num">${isDone ? '✓' : '#' + displayRank}</div>
      <div class="todo-import-cell">${impHtml}</div>
      <div class="todo-body">
        <button class="todo-check ${isDone ? 'is-done' : ''}" title="Mark ${isDone ? 'not done' : 'done'}"
                onclick="toggleTodoDone('${safeId}')">${isDone ? '✓' : ''}</button>
        ${todoTextareaHtml(todo.id, todo.text)}
      </div>
      ${dueCell}
      ${blockCell}
      ${projCell}
      <div class="todo-actions">
        ${isDone ? '' : `
          <button class="todo-btn" title="Promote to #1"   onclick="promoteTodoToTop('${safeId}')">⇈</button>
          <button class="todo-btn" title="Move up"         onclick="moveTodo('${safeId}', -1)">▲</button>
          <button class="todo-btn" title="Move down"       onclick="moveTodo('${safeId}',  1)" ${!showProjectPick && displayRank===totalActive?'disabled':''}>▼</button>
        `}
        <button class="todo-btn danger" title="Delete" onclick="deleteTodo('${safeId}')">✕</button>
      </div>
    </div>
  `;
}

function renderTodo() {
  const host = document.getElementById('todo-view');
  if (!host) return;

  const projects = getProjects();
  let pid = selectedTodoProjectId || GENERAL_PID;
  if (pid !== ALL_PROJECTS_PID && !projects.some(p => p.id === pid)) {
    pid = GENERAL_PID;
    selectedTodoProjectId = GENERAL_PID;
    try { localStorage.setItem('fp-todo-project', GENERAL_PID); } catch (_) {}
  }

  const allView = pid === ALL_PROJECTS_PID;
  const addProjOpts = projects.map(p =>
    `<option value="${esc(p.id)}"${p.id === GENERAL_PID ? ' selected' : ''}>${escHtml(p.name)}</option>`
  ).join('');

  const projOpts =
    `<option value="${ALL_PROJECTS_PID}"${allView ? ' selected' : ''}>All projects</option>` +
    projects.map(p =>
      `<option value="${esc(p.id)}"${p.id === pid ? ' selected' : ''}>${escHtml(p.name)}</option>`
    ).join('');

  const curName = allView
    ? 'All projects'
    : escHtml((projects.find(p => p.id === pid) || {}).name || 'Project');

  const todosAll = getTodos();

  if (localStorage.getItem(TODOS_BACKLOG_OPEN) === null) {
    localStorage.setItem(TODOS_BACKLOG_OPEN, '1');
  }
  const backlogOpen = localStorage.getItem(TODOS_BACKLOG_OPEN) === '1';
  const doneOpen    = localStorage.getItem(TODOS_DONE_OPEN)    === '1';

  let introHtml, top3Html, backlogHtml, doneHtml, toolbarHtml, addProjectHtml;

  if (allView) {
    const activeOrdered = sortAllActiveTodos(todosAll);
    const done = todosAll.filter(t => t.done);

    introHtml = activeOrdered.length === 0 && !done.length ? `
      <div class="todo-intro">
        Every task, every project.
        <span class="todo-empty-hint">Add a task below, then use the Project column to sort items into buckets.</span>
      </div>
    ` : `
      <div class="todo-intro">All tasks across projects. Use the <strong>Project</strong> column to move items into buckets.</div>
    `;

    top3Html = '';

    backlogHtml = activeOrdered.length ? `
      <div class="todo-section ${backlogOpen ? '' : 'collapsed'}" id="todo-backlog">
        <div class="todo-section-header" onclick="toggleTodoSection('backlog')">
          <div class="todo-section-title">
            <span class="todo-caret">▼</span> Active
            <span class="todo-section-count">${activeOrdered.length}</span>
          </div>
          <div class="todo-section-count" style="color:var(--text-faint); background:none;">A→B→C priority</div>
        </div>
        <div class="todo-section-body">
          ${activeOrdered.map((t, i) => renderTodoRow(t, i + 1, activeOrdered.length, true)).join('')}
        </div>
      </div>
    ` : '';

    doneHtml = done.length ? `
      <div class="todo-section ${doneOpen ? '' : 'collapsed'}" id="todo-done">
        <div class="todo-section-header" onclick="toggleTodoSection('done')">
          <div class="todo-section-title">
            <span class="todo-caret">▼</span> Completed
            <span class="todo-section-count">${done.length}</span>
          </div>
          <button class="todo-btn" onclick="event.stopPropagation(); clearCompletedTodos()">Clear all</button>
        </div>
        <div class="todo-section-body">
          ${done.map(t => renderTodoRow(t, 0, activeOrdered.length, true)).join('')}
        </div>
      </div>
    ` : '';

    toolbarHtml = todosAll.length ? `
      <div class="todo-toolbar">
        <div class="todo-toolbar-stats">
          <span><b>${activeOrdered.length}</b> active</span>
          ${done.length ? `<span><b>${done.length}</b> done</span>` : ''}
        </div>
        <div class="todo-toolbar-actions">
          <button class="todo-btn" onclick="expandAllTodoSections()">Show all</button>
          <button class="todo-btn" onclick="collapseAllTodoSections()">Collapse</button>
        </div>
      </div>
    ` : '';

    addProjectHtml = `
      <div class="todo-add-project-wrap">
        <label for="todo-add-project-select">Into</label>
        <select class="todo-add-project-select" id="todo-add-project-select" aria-label="Project for new task">${addProjOpts}</select>
      </div>`;
  } else {
    const activeOrdered = sortActiveTodosForPlate(pid, todosAll);
    const top3 = activeOrdered.slice(0, 3);
    const backlog = activeOrdered.slice(3);
    const todos = todosAll.filter(t => t.projectId === pid);
    const done = todos.filter(t => t.done);

    top3Html = [1, 2, 3].map(r => renderTop3Card(r, top3[r - 1])).join('');

    backlogHtml = backlog.length ? `
      <div class="todo-section ${backlogOpen ? '' : 'collapsed'}" id="todo-backlog">
        <div class="todo-section-header" onclick="toggleTodoSection('backlog')">
          <div class="todo-section-title">
            <span class="todo-caret">▼</span> Backlog
            <span class="todo-section-count">${backlog.length}</span>
          </div>
          <div class="todo-section-count" style="color:var(--text-faint); background:none;">priority order</div>
        </div>
        <div class="todo-section-body">
          ${backlog.map((t, i) => renderTodoRow(t, i + 4, activeOrdered.length, false)).join('')}
        </div>
      </div>
    ` : '';

    doneHtml = done.length ? `
      <div class="todo-section ${doneOpen ? '' : 'collapsed'}" id="todo-done">
        <div class="todo-section-header" onclick="toggleTodoSection('done')">
          <div class="todo-section-title">
            <span class="todo-caret">▼</span> Completed
            <span class="todo-section-count">${done.length}</span>
          </div>
          <button class="todo-btn" onclick="event.stopPropagation(); clearCompletedTodos()">Clear all</button>
        </div>
        <div class="todo-section-body">
          ${done.map(t => renderTodoRow(t, 0, activeOrdered.length, false)).join('')}
        </div>
      </div>
    ` : '';

    introHtml = activeOrdered.length === 0 ? `
      <div class="todo-intro">
        Top three for ${curName}?
        <span class="todo-empty-hint">Add your first task for this project below. The top of the list is what you focus on.</span>
      </div>
    ` : `
      <div class="todo-intro">Your top three for <strong>${curName}</strong>, in priority order.</div>
    `;

    toolbarHtml = todos.length ? `
      <div class="todo-toolbar">
        <div class="todo-toolbar-stats">
          <span><b>${activeOrdered.length}</b> active</span>
          ${backlog.length ? `<span><b>${backlog.length}</b> in backlog</span>` : ''}
          ${done.length ? `<span><b>${done.length}</b> done</span>` : ''}
        </div>
        <div class="todo-toolbar-actions">
          <button class="todo-btn" onclick="expandAllTodoSections()">Show all</button>
          <button class="todo-btn" onclick="collapseAllTodoSections()">Collapse</button>
        </div>
      </div>
    ` : '';

    addProjectHtml = '';
  }

  host.innerHTML = `
    <div class="todo-project-bar">
      <span class="todo-project-label">Project</span>
      <select class="todo-project-select" id="todo-project-select" onchange="onTodoProjectChange(this.value)">${projOpts}</select>
      <button type="button" class="todo-btn" onclick="addProjectFromPrompt()">+ New project</button>
      ${!allView && pid !== GENERAL_PID ? `<button type="button" class="todo-btn danger" onclick="deleteProject(${JSON.stringify(pid)})">Remove project…</button>` : ''}
    </div>
    ${introHtml}
    <div class="top3">${top3Html}</div>
    <div class="todo-add-wrap">
      <div class="todo-add">
        <input id="todo-add-input" class="todo-add-input" type="text"
               placeholder="Add a task and press Enter…"
               oninput="updateTodoMatches(this.value)"
               onkeydown="if(event.key==='Enter'){addTodo();}">
        ${addProjectHtml}
        <button class="todo-add-btn" onclick="addTodo()">Add</button>
      </div>
      <div class="todo-matches" id="todo-matches"></div>
    </div>
    ${toolbarHtml}
    ${backlogHtml}
    ${doneHtml}
  `;

  initTodoTextareas(host);
}

function updateTodoMatches(query) {
  const box = document.getElementById('todo-matches') || document.getElementById('dashboard-todo-matches');
  if (!box) return;
  const q = (query || '').trim().toLowerCase();
  if (q.length < 2) { box.classList.remove('is-open'); box.innerHTML = ''; return; }

  const allTodos = getTodos();
  const allView = currentView === 'todo' && isTodoAllProjectsView();
  let scopePid = GENERAL_PID;
  if (currentView === 'todo' && !allView) scopePid = selectedTodoProjectId || GENERAL_PID;
  else if (currentView === 'dashboard') scopePid = getDashboardTop3ProjectId();

  const todos = allView ? allTodos : allTodos.filter(t => t.projectId === scopePid);
  const sortedActive = allView ? sortAllActiveTodos(allTodos) : sortActiveTodosForPlate(scopePid, allTodos);
  const inTop = allView ? new Set() : new Set(sortedActive.slice(0, 3).map(t => t.id));
  const projectNames = Object.fromEntries(getProjects().map(p => [p.id, p.name]));

  const hits = todos
    .map(t => ({ t, score: t.text.toLowerCase().includes(q) ? 1 : 0 }))
    .filter(x => x.score > 0)
    .slice(0, 6);

  if (!hits.length) { box.classList.remove('is-open'); box.innerHTML = ''; return; }

  const exact = hits.some(h => h.t.text.trim().toLowerCase() === q);
  const label = exact
    ? `<span class="todo-matches-warn">Exact duplicate already on your list</span>`
    : `${hits.length} existing task${hits.length === 1 ? '' : 's'} match`;

  box.innerHTML = `
    <div class="todo-matches-label">${label}</div>
    ${hits.map(({ t }) => {
      let whereLabel;
      if (allView) whereLabel = escHtml(projectNames[t.projectId] || 'General');
      else whereLabel = t.done ? 'Done' : (inTop.has(t.id) ? 'Top 3' : 'Backlog');
      const where = allView ? 'is-backlog' : (t.done ? 'is-done' : (inTop.has(t.id) ? 'is-top' : 'is-backlog'));
      return `
        <div class="todo-match">
          <span class="todo-match-tag ${where}">${whereLabel}</span>
          <span>${escHtml(t.text)}</span>
        </div>
      `;
    }).join('')}
  `;
  box.classList.add('is-open');
}

function expandAllTodoSections() {
  localStorage.setItem(TODOS_BACKLOG_OPEN, '1');
  localStorage.setItem(TODOS_DONE_OPEN, '1');
  renderTodo();
}

function collapseAllTodoSections() {
  localStorage.setItem(TODOS_BACKLOG_OPEN, '0');
  localStorage.setItem(TODOS_DONE_OPEN, '0');
  renderTodo();
}

function toggleTodoSection(which) {
  const key  = which === 'backlog' ? TODOS_BACKLOG_OPEN : TODOS_DONE_OPEN;
  const open = localStorage.getItem(key) === '1';
  localStorage.setItem(key, open ? '0' : '1');
  const el = document.getElementById(which === 'backlog' ? 'todo-backlog' : 'todo-done');
  if (el) el.classList.toggle('collapsed');
}

setView('dashboard');
</script>
</body>
</html>
